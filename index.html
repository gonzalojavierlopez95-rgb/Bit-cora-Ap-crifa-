  // mantenemos una revisión de baja frecuencia mientras la barra sigue
  // flotando. En algunos WebViews el teclado cambia de alto un rato
  // después de haberse asentado (por ejemplo cuando Gboard agrega o saca
  // su tira de sugerencias/autocorrección al empezar a tipear), y esos
  // cambios no siempre llegan como evento de "resize" del visualViewport.
  // Este chequeo periódico corrige cualquier desfase sin gastar batería
  // como haría un requestAnimationFrame continuo.
  let keyboardPollInterval = null;
  function startKeyboardPoll(){
    if(keyboardPollInterval) return;
    keyboardPollInterval = setInterval(() => {
      if(!formatBarEl.classList.contains('floating')){
        stopKeyboardPoll();
        return;
      }
      positionFloatingBar();
      updateBodyPadding();
    }, 600);
  }
  function stopKeyboardPoll(){
    clearInterval(keyboardPollInterval);
    keyboardPollInterval = null;
  }

  function updateBodyPadding(){
    if(formatBarEl.classList.contains('floating')){
      bodyEl.style.paddingBottom = (formatBarEl.offsetHeight + 16) + 'px';
    }else{
      bodyEl.style.paddingBottom = '';
    }
  }

  // Activa el modo flotante SOLO si: (a) seguimos en un campo editable, y
  // (b) el teclado ya está realmente cubriendo una franja de pantalla (o,
  // en los navegadores que reacomodan el layout viewport solos, ya se
  // achicó la pantalla disponible). Enfocar un campo por sí solo (por
  // ejemplo el autoenfoque al abrir una nota) ya NO alcanza para que la
  // barra salte arriba.
  // A pedido tuyo: además de que la barra suba sola cuando aparece el
  // teclado, agregamos un botón para subirla o bajarla vos a mano,
  // cuando quieras -sin depender de tocar el teclado-. Esto resultó
  // molesto: con el auto-flote activado, con solo tocar en cualquier
  // parte de la nota para escribir, la barra saltaba abajo aunque no la
  // hubieras pedido. Así que lo sacamos del todo -de ahora en más la
  // barra SOLO se mueve cuando tocás el botón, nunca sola-.
  let barManualUp = false;   // pedida arriba (no flotando), aunque haya teclado
  let barManualDown = false; // pedida abajo (flotando), aunque no haya teclado/foco

  function activateFloatingIfKeyboardVisible(){
    // Desactivado a pedido: la barra ya no se mueve sola con el
    // teclado, solo con el botón (ver barPinBtn más abajo).
    return;
  }

    function showFloatingBar(){
    clearTimeout(hideFloatTimeout);
    // Apenas se enfoca el campo (todavía sin teclado real en pantalla)
    // guardamos la altura "de referencia" para poder notar más tarde si
    // el navegador achicó window.innerHeight solo por su cuenta (ver el
    // comentario grande de arriba, caso B).
    heightBeforeKeyboard = window.innerHeight;
    // Ya no agregamos la clase "floating" acá directamente: la agrega
    // activateFloatingIfKeyboardVisible en cuanto detecte que el teclado
    // real apareció (ver el comentario de arriba). Acá solo arrancamos
    // el seguimiento cuadro a cuadro para pescar ese momento apenas
    // ocurra.
    activateFloatingIfKeyboardVisible();
    // La apertura del teclado tarda ~250-350ms en animar en la mayoría de
    // los dispositivos; seguimos de cerca ese tramo con margen de sobra.
    trackKeyboardMotion(500);
  }

  function hideFloatingBarDeferred(){
    clearTimeout(hideFloatTimeout);
    hideFloatTimeout = setTimeout(() => {
      if(barManualDown) return;
      const active = document.activeElement;
      const stillEditing = active === bodyEl || active === titleEl || formatBarEl.contains(active);
      if(!stillEditing){
        formatBarEl.classList.remove('floating');
        formatBarEl.style.bottom = '';
        bodyEl.style.paddingBottom = '';
        stopKeyboardPoll();
        // Al dejar de editar, el teclado ya cerró (o está por cerrar):
        // refrescamos la altura de referencia para la próxima vez.
        heightBeforeKeyboard = window.innerHeight;
      }
    }, 150);
  }

  if(vv){
    // El teclado se abre/cierra de forma animada: 'resize' y 'scroll' del
    // visualViewport se disparan durante toda la transición, así que
    // reposicionamos en cada evento para que la barra "siga" al teclado
    // en vez de saltar de golpe al final. Además, cada evento reinicia el
    // seguimiento cuadro a cuadro por si la animación sigue en curso.
    vv.addEventListener('resize', () => { activateFloatingIfKeyboardVisible(); positionFloatingBar(); updateBodyPadding(); trackKeyboardMotion(400); });
    vv.addEventListener('scroll', () => { activateFloatingIfKeyboardVisible(); positionFloatingBar(); trackKeyboardMotion(400); });
  }
  // Algunos navegadores/WebViews (caso B de arriba) avisan el cambio de
  // teclado por acá, moviendo directo window.innerHeight, en vez de (o
  // además de) por el visualViewport.
  window.addEventListener('resize', () => {
    activateFloatingIfKeyboardVisible();
    if(!formatBarEl.classList.contains('floating')){
      // Sin teclado en danza: aprovechamos para refrescar la referencia
      // (cubre rotaciones de pantalla, cambios de barra del navegador, etc).
      heightBeforeKeyboard = window.innerHeight;
    }
  });

  titleEl.addEventListener('focus', showFloatingBar);
  titleEl.addEventListener('focus', () => { lastFocusTarget = 'title'; });
  titleEl.addEventListener('blur', hideFloatingBarDeferred);
  bodyEl.addEventListener('focus', showFloatingBar);
  bodyEl.addEventListener('focus', () => { lastFocusTarget = 'body'; });
  bodyEl.addEventListener('blur', hideFloatingBarDeferred);

  // ---- Scroll horizontal manual del título ----
  // El "touch-action:pan-x" y el overflow-x:auto nativos dejan de andar
  // para el gesto de arrastre cuando el título tiene el color de LETRA en
  // arcoíris (-webkit-text-fill-color:transparent + -webkit-background-
  // clip:text): en Chrome/Android ese combo hace que el navegador ya no
  // trate el cuadro como "scrolleable" con el dedo (el scroll con fondo
  // arcoíris sí funciona porque ahí no se toca text-fill-color). Para no
  // depender de ese comportamiento nativo, movemos scrollLeft a mano.
  (function(){
    let touchId = null, startX = 0, startY = 0, startScrollLeft = 0;
    let decided = false, isHorizontalDrag = false;

    titleEl.addEventListener('touchstart', e => {
      if(e.touches.length !== 1) return;
      const t = e.touches[0];
      touchId = t.identifier;
      startX = t.clientX;
      startY = t.clientY;
      startScrollLeft = titleEl.scrollLeft;
      decided = false;
      isHorizontalDrag = false;
    }, {passive:true});

    titleEl.addEventListener('touchmove', e => {
      const t = [...e.touches].find(x => x.identifier === touchId);
      if(!t) return;
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      if(!decided){
        // recién decidimos si es arrastre horizontal o un toque/scroll
        // vertical de la página una vez que se movió lo suficiente, para
        // no comerse los toques cortos (posicionar cursor, selección).
        if(Math.abs(dx) > 6 || Math.abs(dy) > 6){
          decided = true;
          isHorizontalDrag = Math.abs(dx) > Math.abs(dy);
        }
      }
      if(decided && isHorizontalDrag){
        e.preventDefault();
        titleEl.scrollLeft = startScrollLeft - dx;
      }
    }, {passive:false});

    function endTitleDrag(e){
      const stillThere = [...e.touches].some(x => x.identifier === touchId);
      if(!stillThere){ touchId = null; decided = false; isHorizontalDrag = false; }
    }
    titleEl.addEventListener('touchend', endTitleDrag);
    titleEl.addEventListener('touchcancel', endTitleDrag);
  })();

  const barPinBtn = document.getElementById('barPinBtn');
  function updateBarPinButton(){
    const isDown = formatBarEl.classList.contains('floating');
    barPinBtn.classList.toggle('pinned-down', isDown);
    barPinBtn.title = isDown ? 'Subir la barra de herramientas' : 'Bajar la barra de herramientas';
  }
  barPinBtn.addEventListener('mousedown', e => e.preventDefault());
  barPinBtn.addEventListener('click', () => {
    const isDown = formatBarEl.classList.contains('floating');
    if(isDown){
      barManualDown = false;
      barManualUp = true;
      formatBarEl.classList.remove('floating');
      formatBarEl.style.bottom = '';
      bodyEl.style.paddingBottom = '';
      stopKeyboardPoll();
    }else{
      barManualUp = false;
      barManualDown = true;
      formatBarEl.classList.add('floating');
      positionFloatingBar();
      updateBodyPadding();
    }
    updateBarPinButton();
  });
  updateBarPinButton();
  formatBarEl.addEventListener('focusin', showFloatingBar);
  formatBarEl.addEventListener('focusout', hideFloatingBarDeferred);


  // Control de scroll rápido: una "manija" flotante al costado del cuerpo
  // de la nota (igual que la de Word) para saltar rápido en textos largos.
  const scrollThumb = document.getElementById('scrollThumb');
  const bodyWrapEl = document.querySelector('.note-body-wrap');
  let thumbHideTimeout = null;
  let thumbDragging = false;

  function isBodyScrollable(){
    return (bodyEl.scrollHeight - bodyEl.clientHeight) > 40;
  }

  function positionThumb(){
    if(!isBodyScrollable()){
      scrollThumb.classList.remove('visible');
      return;
    }
    const trackH = bodyWrapEl.clientHeight - scrollThumb.offsetHeight;
    const scrollable = bodyEl.scrollHeight - bodyEl.clientHeight;
    const ratio = scrollable > 0 ? (bodyEl.scrollTop / scrollable) : 0;
    const y = Math.max(0, Math.min(trackH, ratio * trackH));
    scrollThumb.style.transform = `translateY(${y}px)`;
  }

  function showThumb(){
    if(!isBodyScrollable()) return;
    positionThumb();
    scrollThumb.classList.add('visible');
    clearTimeout(thumbHideTimeout);
    if(!thumbDragging){
      thumbHideTimeout = setTimeout(() => scrollThumb.classList.remove('visible'), 1100);
    }
  }

  bodyEl.addEventListener('scroll', showThumb, {passive:true});
  bodyEl.addEventListener('input', () => requestAnimationFrame(positionThumb));
  window.addEventListener('resize', () => requestAnimationFrame(positionThumb));

  function dragToRatio(clientY){
    const rect = bodyWrapEl.getBoundingClientRect();
    const trackH = bodyWrapEl.clientHeight - scrollThumb.offsetHeight;
    const half = scrollThumb.offsetHeight / 2;
    const ratio = trackH > 0 ? Math.max(0, Math.min(1, (clientY - rect.top - half) / trackH)) : 0;
    const scrollable = bodyEl.scrollHeight - bodyEl.clientHeight;
    bodyEl.scrollTop = ratio * scrollable;
    positionThumb();
  }

  scrollThumb.addEventListener('pointerdown', e => {
    if(!isBodyScrollable()) return;
    e.preventDefault();
    thumbDragging = true;
    clearTimeout(thumbHideTimeout);
    scrollThumb.classList.add('dragging', 'visible');
    scrollThumb.setPointerCapture(e.pointerId);
  });
  scrollThumb.addEventListener('pointermove', e => {
    if(!thumbDragging) return;
    e.preventDefault();
    dragToRatio(e.clientY);
  });
  function endThumbDrag(e){
    if(!thumbDragging) return;
    thumbDragging = false;
    scrollThumb.classList.remove('dragging');
    thumbHideTimeout = setTimeout(() => scrollThumb.classList.remove('visible'), 1100);
  }
  scrollThumb.addEventListener('pointerup', endThumbDrag);
  scrollThumb.addEventListener('pointercancel', endThumbDrag);

  document.getElementById('undoBtn').addEventListener('click', () => {
    doUndo();
  });
  document.getElementById('redoBtn').addEventListener('click', () => {
    doRedo();
  });
  document.getElementById('commentBtn').addEventListener('click', toggleComment);

  // Guardamos la última selección hecha adentro de noteBody como respaldo,
  // por si algún navegador la llegara a perder igual.
  let savedRange = null;
  document.addEventListener('selectionchange', () => {
    // Mientras hay un menú desplegable de la barra de formato abierto
    // (por ejemplo el de colores), NO dejamos que esto pise el rango
    // que ya guardamos al abrirlo. En algunos celulares, con el menú
    // abierto y el teclado/el cuerpo perdiendo el foco, el navegador
    // dispara igual un "selectionchange" que colapsa la selección -y
    // si lo dejábamos pasar acá, se perdía el texto seleccionado
    // justo antes de llegar a tocar el color, así que el botón parecía
    // no hacer nada (o agarraba a veces sí, a veces no, según lo
    // rápido que tocaras).
    if(document.querySelector('.fb-dd-menu.fb-dd-menu-open')) return;
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if(bodyEl.contains(range.commonAncestorContainer)){
      savedRange = range.cloneRange();
    }
  });

  // A pedido tuyo: cuando seleccionás texto de verdad (arrastrando el
  // dedo) en el cuerpo de la nota, escondemos el teclado para que
  // tengas más pantalla para ver el texto. "inputmode=none" le dice al
  // navegador que no hace falta mostrar el teclado, SIN sacarte el
  // foco ni la selección -así el menú nativo de Cortar/Copiar/Seleccionar
  // todo sigue funcionando igual-. Apenas volvés a tocar para dejar el
  // cursor en un solo punto (selección colapsada), se lo devolvemos.
  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if(!bodyEl.contains(range.commonAncestorContainer)) return;
    if(!range.collapsed){
      bodyEl.setAttribute('inputmode', 'none');
    }else{
      bodyEl.removeAttribute('inputmode');
    }
  });
  function captureSelectionNow(){
    const sel = window.getSelection();
    if(sel && sel.rangeCount && bodyEl.contains(sel.getRangeAt(0).commonAncestorContainer)){
      savedRange = sel.getRangeAt(0).cloneRange();
    }
  }
  function restoreSelection(){
    if(!savedRange || !bodyEl.contains(savedRange.commonAncestorContainer)) return false;
    bodyEl.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
    return true;
  }
  function convertFontSizeStamps(px){
    bodyEl.querySelectorAll('font[size="7"]').forEach(f => {
      f.removeAttribute('size');
      f.style.fontSize = px + 'px';
    });
  }
  let pendingFontSizePx = null;
  bodyEl.addEventListener('input', () => {
    if(pendingFontSizePx) convertFontSizeStamps(pendingFontSizePx);
  });
  function fontFamilyLabelFor(value){
    if(!value) return 'Tipo';
    const items = document.querySelectorAll('#fontFamilyMenu .fb-dd-item');
    for(const item of items){
      if(item.dataset.value === value) return item.textContent.trim();
    }
    return 'Tipo';
  }
  function applyFontFamily(value){
    if(!value) return;
    if(lastFocusTarget === 'title'){
      // El título se trata como una sola pieza (igual que sus colores de
      // letra/fondo), no por selección parcial de texto.
      titleEl.style.fontFamily = value;
      const n = notes.find(x => x.id === currentId);
      if(n) n.titleFont = value;
      scheduleSave();
      return;
    }
    if(!restoreSelection()) return;
    document.execCommand('fontName', false, value);
    scheduleSave();
  }
  function applyFontSize(px){
    if(!px || !restoreSelection()) return;
    // Truco clásico: execCommand('fontSize') solo admite la escala legada
    // 1-7, así que aplicamos un tamaño "sello" (7) y después reemplazamos
    // los <font size="7"> resultantes por el tamaño real en CSS.
    // Si no había texto seleccionado (cursor solo), el navegador recién crea
    // la etiqueta cuando empezás a tipear, así que dejamos la conversión
    // pendiente para el próximo evento "input" también.
    document.execCommand('fontSize', false, '7');
    pendingFontSizePx = px;
    convertFontSizeStamps(px);
    scheduleSave();
  }

  // Arcoíris a bandas: en vez de intentar un degradé "de verdad" con
  // trucos de CSS (background-clip:text) o de encontrar/reemplazar algo
  // después de aplicarlo, dividimos el texto seleccionado en franjas y le
  // aplicamos a cada franja un color sólido con el MISMO execCommand
  // (foreColor/hiliteColor) que ya confirmaste que funciona siempre. No
  // hace falta adivinar ni buscar nada: cada franja se pinta con la
  // operación de toda la vida, nomás repetida varias veces.
  //
  // Vamos de la ÚLTIMA franja hacia la PRIMERA a propósito: pintar una
  // franja parte/reemplaza el nodo de texto de ahí en más, así que si
  // fuéramos de adelante para atrás, las franjas que faltan procesar
  // quedarían apuntando a un nodo que ya no existe. Yendo de atrás para
  // adelante, lo que queda sin pintar (antes de la franja actual) nunca
  // se toca, así que sigue siendo válido para la siguiente vuelta.
  const RAINBOW_PALETTE = ['#c026d3', '#7b2ff7', '#4d3dff', '#00e5ff', '#00ffc8', '#39ff14', '#b6ff00', '#faed27', '#ffb700', '#ff9d00', '#ff3131', '#ff2079'];

  // Estilos del degradé de verdad (letra y fondo), en un solo lugar para
  // que tanto "escribir con arcoíris activado" como "pintar una selección"
  // usen exactamente el mismo look.
  const RAINBOW_FG_STYLE = `background:${RAINBOW_GRADIENT};-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:0;text-stroke:0;filter:saturate(1.6) brightness(1.25) drop-shadow(0 0 5px rgba(255,255,255,0.5));`;
  const RAINBOW_BG_STYLE = `background:${RAINBOW_GRADIENT};filter:saturate(1.6) brightness(1.15);box-shadow:0 0 10px rgba(255,255,255,0.35);border-radius:2px;`;

  // "Arcoíris mientras escribís": modo aparte para cuando el usuario
  // activa el arcoíris SIN tener texto seleccionado (como hace con los
  // demás colores: elegir el color y después tipear). En ese caso no hay
  // nada que dividir en franjas todavía, así que en vez de fallar
  // coloreamos cada letra nueva a medida que se escribe, cíclicamente.
  let rainbowTyping = null; // null (apagado) o {kind:'fg'|'bg', wrapper}

  function stopRainbowTyping(){
    rainbowTyping = null;
  }

  // Antes esto pintaba cada letra nueva con un color sólido de una
  // paleta de 6, cíclicamente -por diseño eso da bandas de color, nunca
  // un degradé difuminado, por más prolijo que salga el resto-.
  //
  // Ahora, en vez de pintar letra por letra, dejamos un único <span>
  // vacío con el degradé ya puesto justo en la posición del cursor,
  // y confiamos en el comportamiento normal de un campo editable: lo
  // que se tipea con el cursor adentro de un elemento se sigue
  // escribiendo adentro de ESE elemento. Como el degradé de fondo
  // (background-clip:text) se recalcula solo sobre el ancho real del
  // span, a medida que escribís el span crece y el arcoíris fluye con
  // vos en tiempo real -es el mismo truco que ya usa el título-.
  // Deja el cursor "escribiendo adentro" de un elemento con el estilo
  // indicado (o sin estilo ninguno, para "normal"). Es el MISMO truco
  // para los tres casos -arcoíris, color sólido, o volver a lo
  // normal-: antes, para color sólido y para "normal" seguíamos
  // confiando en que el navegador (execCommand) se acordara solo de
  // qué tenías que tipear después; tu prueba mostró que a veces no se
  // acuerda -seguía saliendo el color anterior por más que apretaras
  // otro botón-. Haciéndolo siempre a mano, con nuestro propio
  // elemento, no dependemos de que el navegador "se acuerde" de nada.
  function startTypingWithStyle(kind, styleAttr, isRainbow){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if(!range.collapsed) return;

    const wrapper = document.createElement('span');
    if(styleAttr) wrapper.setAttribute('style', styleAttr);
    if(isRainbow) wrapper.setAttribute('data-rainbow', kind);
    // Un espacio de ancho cero le da al span algo "adentro" donde
    // apoyar el cursor. Es invisible, no afecta el texto ni el ancho.
    const zwsp = document.createTextNode('\u200B');
    wrapper.appendChild(zwsp);
    range.insertNode(wrapper);

    const caret = document.createRange();
    caret.setStart(zwsp, 1);
    caret.collapse(true);
    sel.removeAllRanges();
    sel.addRange(caret);

    rainbowTyping = {kind, wrapper};
  }

  function startRainbowTyping(kind){
    startTypingWithStyle(kind, kind === 'fg' ? RAINBOW_FG_STYLE : RAINBOW_BG_STYLE, true);
  }

  // Si el usuario se va del cuerpo de la nota (cambia de nota, toca el
  // título, etc.), apagamos el modo para que no quede "pegado" y
  // coloreando cosas donde no corresponde.
  bodyEl.addEventListener('blur', stopRainbowTyping);

  function getTextNodesInRange(range){
    // En vez de compareBoundaryPoints (semántica fácil de confundir) o
    // intersectsNode (no soportado en todos los navegadores viejos),
    // juntamos todos los nodos de texto del cuerpo en orden y usamos
    // indexOf directo sobre range.startContainer/endContainer -que ya
    // son referencias concretas que tenemos- para saber cuáles caen
    // adentro. Simple e inequívoco.
    const allTextNodes = [];
    const walker = document.createTreeWalker(bodyEl, NodeFilter.SHOW_TEXT);
    let n;
    while((n = walker.nextNode())) allTextNodes.push(n);
    if(!allTextNodes.length) return [];

    let startIdx = allTextNodes.indexOf(range.startContainer);
    let endIdx = allTextNodes.indexOf(range.endContainer);

    // Si el borde de la selección cae justo en un elemento (no en un
    // nodo de texto), buscamos el primer/último nodo de texto real
    // dentro de ese elemento como respaldo.
    if(startIdx === -1){
      startIdx = allTextNodes.findIndex(t => range.startContainer.contains && range.startContainer.contains(t));
      if(startIdx === -1) startIdx = 0;
    }
    if(endIdx === -1){
      for(let i = allTextNodes.length - 1; i >= 0; i--){
        if(range.endContainer.contains && range.endContainer.contains(allTextNodes[i])){ endIdx = i; break; }
      }
      if(endIdx === -1) endIdx = allTextNodes.length - 1;
    }
    if(startIdx > endIdx) return [];
    return allTextNodes.slice(startIdx, endIdx + 1);
  }

  function showRainbowDebugToast(msg){
    // Herramienta de diagnóstico ya desactivada -era temporal, para ver
    // en pantalla si el arcoíris fallaba con algo imprevisto mientras
    // arreglábamos esto. Se deja la función vacía (en vez de borrar
    // todos los llamados desparramados) para no romper nada.
    return;
  }

  // Le saca a UN elemento puntual el estilo de arcoíris que le hubiéramos
  // puesto (letra o fondo), sin sacar el elemento en sí del árbol. Esto es
  // clave: si en cambio lo desenvolviéramos (sacar el <span> y dejar sus
  // hijos sueltos), cualquier selección que ya estuviera apuntando a ese
  // elemento como límite quedaría rota. Tocando solo el "style", el
  // elemento sigue estando ahí, la selección sigue siendo válida, y el
  // texto queda como un span "neutro" listo para recibir el color nuevo.
  function stripRainbowStyle(el, kind){
    if(kind === 'fg'){
      el.style.removeProperty('background');
      el.style.removeProperty('background-image');
      el.style.removeProperty('-webkit-background-clip');
      el.style.removeProperty('background-clip');
      el.style.removeProperty('color');
      el.style.removeProperty('-webkit-text-fill-color');
      el.style.removeProperty('-webkit-text-stroke');
      el.style.removeProperty('filter');
    }else{
      el.style.removeProperty('background');
      el.style.removeProperty('background-image');
      el.style.removeProperty('background-color');
      el.style.removeProperty('filter');
      el.style.removeProperty('box-shadow');
      el.style.removeProperty('border-radius');
    }
    el.removeAttribute('data-rainbow');
    if(!el.getAttribute('style')) el.removeAttribute('style');
  }

  // Antes de aplicar CUALQUIER color nuevo (sólido, "sin color", o
  // arcoíris de nuevo) sobre una selección, primero limpiamos el arcoíris
  // que hubiera quedado puesto ahí antes -tanto si el envoltorio del
  // arcoíris es ANCESTRO de la selección (elegiste solo una parte de un
  // texto ya arcoíris) como si cae ADENTRO de ella (la selección abarca
  // uno o más tramos en arcoíris).
  //
  // Esto es lo que faltaba: antes, elegir un color nuevo (o "sin color")
  // encima de texto en arcoíris no hacía nada visible, porque el color
  // nuevo quedaba puesto DENTRO de un elemento que seguía teniendo
  // "-webkit-text-fill-color:transparent" (letra) o el degradé de fondo
  // (fondo) -y esas dos propiedades ganan por encima de cualquier cosa
  // que se le agregue adentro, tapando el cambio nuevo. Al limpiarlas
  // primero, el color que elijas después queda realmente visible.
  function clearRainbowStylesInRange(kind, range){
    // OJO: esto SOLO debe actuar cuando hay una selección de texto de
    // verdad (el usuario resaltó algo con la intención de cambiarle el
    // color). Si el rango está colapsado -el cursor apoyado en algún
    // lado, sin nada resaltado- NO tocamos nada: si el cursor
    // simplemente cae adentro de un tramo que ya escribiste en
    // arcoíris (para seguir editando ahí, por ejemplo), no hay que
    // borrarle el estilo a TODO el tramo solo porque el cursor pasó por
    // encima. Eso era justo lo que te estaba borrando el trabajo ya
    // hecho.
    if(!range || range.collapsed) return;
    if(!bodyEl.contains(range.commonAncestorContainer)) return;
    try{
      let node = range.commonAncestorContainer;
      if(node.nodeType === 3) node = node.parentNode;
      let anc = node;
      while(anc && anc !== bodyEl && anc.nodeType === 1){
        if(anc.matches && anc.matches(`[data-rainbow="${kind}"]`)) stripRainbowStyle(anc, kind);
        anc = anc.parentNode;
      }
      bodyEl.querySelectorAll(`[data-rainbow="${kind}"]`).forEach(el => {
        if(range.intersectsNode && range.intersectsNode(el)) stripRainbowStyle(el, kind);
      });
    }catch(err){
      // Si algo salió raro acá, mejor no insistir y seguir de largo con
      // el color nuevo: es preferible dejar un resto de arcoíris viejo
      // sin limpiar que arriesgarse a romper el texto.
    }
  }

  // Dejar el cursor "después" de un elemento con un simple límite de
  // Range (setStartAfter) no alcanza de forma confiable en este
  // navegador: a veces sigue tratando lo próximo que tipeás como si
  // estuviera adentro del elemento de al lado -eso era lo que hacía
  // que, después de pintar una selección, siguieras escribiendo con el
  // mismo color puesto-. Insertamos un carácter invisible SUELTO -sin
  // ningún span alrededor- justo después del elemento, y apoyamos el
  // cursor ahí adentro: así no hay ambigüedad posible sobre dónde
  // "vive" lo próximo que escribas.
  function placeCollapsedCursorAfter(el){
    const sel = window.getSelection();
    if(!sel || !el || !el.parentNode) return;
    const anchor = document.createTextNode('\u200B');
    el.parentNode.insertBefore(anchor, el.nextSibling);
    const r = document.createRange();
    r.setStart(anchor, 1);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  }

  // BUGFIX: Range.extractContents() tiene un atajo nativo: si la
  // selección entera cae DENTRO de un mismo nodo de texto (por ejemplo,
  // todo o parte del contenido de un <span> ya pintado), el navegador
  // extrae solo las letras sueltas -SIN clonar el span que las
  // envuelve-. El span original (con su color/fondo, incluido el
  // "color:transparent" del arcoíris de letra) se queda vivo en el DOM
  // como padre del punto de inserción, y lo que insertemos ahí adentro
  // HEREDA ese estilo -por eso un fondo gris nuevo mostraba letras
  // invisibles: el gris se ve porque background-color no se hereda,
  // pero el texto sí hereda el color transparente del arcoíris viejo
  // que nunca llegamos a limpiar-.
  //
  // Solución: si detectamos ese caso puntual, partimos el padre
  // estilado a mano en "antes" / "selección" / "después" ANTES de
  // llamar a extractContents, dejando la selección como texto suelto,
  // sin ningún ancestro con estilo del que heredar nada raro.
  function isolateStyledAncestor(range){
    if(!range || range.collapsed) return;
    const textNode = range.startContainer;
    if(range.endContainer !== textNode || textNode.nodeType !== 3) return;
    const parent = textNode.parentNode;
    if(!parent || parent === bodyEl || parent.nodeType !== 1) return;
    const hasStyling = parent.hasAttribute('data-rainbow') ||
      (parent.style && (parent.style.color || parent.style.background ||
        parent.style.backgroundColor || parent.style.backgroundImage ||
        parent.style.webkitTextFillColor));
    if(!hasStyling) return;

    const fullText = textNode.data;
    const startOff = range.startOffset, endOff = range.endOffset;
    const before = fullText.slice(0, startOff);
    const middle = fullText.slice(startOff, endOff);
    const after = fullText.slice(endOff);
    if(!middle) return;

    const grandparent = parent.parentNode;
    if(!grandparent) return;
    // OJO: el pedazo "seleccionado" (middle) queda como texto SUELTO,
    // sin ningún span alrededor -a propósito-. Probamos antes clonarle
    // el estilo del padre para no "perderlo", pero eso disparaba el
    // MISMO atajo de extractContents una segunda vez (ahora sobre el
    // clon), dejando otra vez un ancestro estilado fantasma envolviendo
    // lo nuevo -el mismo bug, un nivel más adentro-. La preservación
    // del estilo del otro tipo (letra/fondo) ya la maneja aparte
    // findEnclosingKindStyle, ANTES de llamar a esta función, así que
    // acá alcanza con sacar el texto limpio y listo.
    const middleNode = document.createTextNode(middle);

    if(before){
      const beforeClone = parent.cloneNode(false);
      beforeClone.textContent = before;
      grandparent.insertBefore(beforeClone, parent);
    }
    grandparent.insertBefore(middleNode, parent);
    if(after){
      const afterClone = parent.cloneNode(false);
      afterClone.textContent = after;
      grandparent.insertBefore(afterClone, parent);
    }
    grandparent.removeChild(parent);

    range.setStart(middleNode, 0);
    range.setEnd(middleNode, middle.length);
  }

  // Antes de tocar nada, nos fijamos si TODA la selección ya está
  // adentro de un único elemento con estilo del OTRO tipo (por ejemplo,
  // vas a aplicar fondo y toda la selección ya está en arcoíris de
  // letra). Si es así, lo recordamos para combinarlo con lo nuevo en
  // vez de perderlo quando lo extraigamos.
  function findEnclosingKindStyle(range, kind){
    if(!range) return null;
    let node = range.commonAncestorContainer;
    if(node.nodeType === 3) node = node.parentNode;
    let anc = node;
    while(anc && anc !== bodyEl && anc.nodeType === 1){
      const isRainbowOfKind = anc.getAttribute && anc.getAttribute('data-rainbow') === kind;
      const hasPlainStyle = !anc.getAttribute('data-rainbow') && anc.style && (
        kind === 'fg' ? !!anc.style.color : !!(anc.style.backgroundColor || anc.style.background)
      );
      if(isRainbowOfKind || hasPlainStyle){
        return {isRainbow: isRainbowOfKind, style: anc.getAttribute('style')};
      }
      anc = anc.parentNode;
    }
    return null;
  }

  // Arma el span del tipo que se está aplicando ahora, y si había un
  // estilo del OTRO tipo para conservar (ver findEnclosingKindStyle),
  // lo anida en el ORDEN correcto: el FONDO siempre por AFUERA, la
  // LETRA siempre por ADENTRO. Por qué importa el orden: el arcoíris
  // de letra pinta su degradé "recortado" a la forma de cada letra
  // (background-clip:text) sobre SU PROPIO fondo -si el fondo sólido
  // quedara adentro de la letra en vez de afuera, la letra heredaría
  // el "transparent" de afuera y el fondo sólido, al no estar
  // recortado, la taparía entera. Puesto como corresponde -fondo
  // afuera, letra adentro-, el fondo sólido pinta la caja completa y
  // el degradé de letra se recorta encima, mostrando ambos a la vez.
  function wrapKindPreservingOther(kind, frag, currentStyleAttr, currentIsRainbow, preserved){
    const otherKind = kind === 'fg' ? 'bg' : 'fg';
    const currentSpan = document.createElement('span');
    if(currentStyleAttr) currentSpan.setAttribute('style', currentStyleAttr);
    if(currentIsRainbow) currentSpan.setAttribute('data-rainbow', kind);

    if(preserved){
      const otherSpan = document.createElement('span');
      if(preserved.style) otherSpan.setAttribute('style', preserved.style);
      if(preserved.isRainbow) otherSpan.setAttribute('data-rainbow', otherKind);
      if(otherKind === 'bg'){
        currentSpan.appendChild(frag);
        otherSpan.appendChild(currentSpan);
        return otherSpan;
      }else{
        otherSpan.appendChild(frag);
        currentSpan.appendChild(otherSpan);
        return currentSpan;
      }
    }

    currentSpan.appendChild(frag);
    return currentSpan;
  }

  function applyRainbowSmooth(kind, range){
    // Degradé de verdad (como el título): en vez de pintar con
    // execCommand y después salir a "adivinar" con un MutationObserver
    // qué tocó el navegador -que era el origen de los dos problemas
    // que veníamos arrastrando-, envolvemos DIRECTAMENTE todo el
    // contenido seleccionado en un único <span>.
    //
    // Por qué esto arregla las "franjas compactas": execCommand no
    // garantiza un solo elemento resultado. Si la selección cruza más
    // de un nodo de texto o un formato ya puesto (negrita, un color
    // anterior, etc.), el navegador reparte el cambio en VARIOS
    // elementos -y como cada uno recibía el degradé completo por su
    // cuenta, se veía como el arcoíris repetido a los saltos en vez de
    // fluyendo parejo. Envolviendo todo en un solo span, el degradé se
    // calcula una sola vez sobre el ancho total y fluye de punta a
    // punta sin importar cuántos nodos había adentro.
    //
    // Por qué esto arregla el "se traba, aparece otro color": antes
    // dependíamos de que el MutationObserver alcanzara a registrar el
    // cambio a tiempo (es asincrónico por naturaleza) para reemplazar
    // el color "marca" por el degradé; si eso fallaba -algo más común
    // en mobile-, el color marca quedaba pegado en el texto sin que
    // nada lo reemplazara. Acá no hay marca ni detective: todo pasa en
    // un solo paso sincrónico.
    if(!range || range.collapsed) return false;
    try{
      const otherKind = kind === 'fg' ? 'bg' : 'fg';
      // Lo buscamos ANTES de extraer nada: extractContents puede
      // "perder" el span ancestro que lo contiene (ver
      // isolateStyledAncestor más arriba), así que lo guardamos
      // primero para poder reconstruirlo después, en el orden correcto.
      const preserved = findEnclosingKindStyle(range, otherKind);

      isolateStyledAncestor(range);
      const frag = range.extractContents();
      if(!frag || !frag.textContent) return false;

      // Si adentro de lo seleccionado ya había color de letra o de
      // fondo puesto a mano (incluido un arcoíris anterior anidado) DEL
      // MISMO TIPO que estamos por aplicar ahora, hay que sacarlo: si
      // no, queda por encima del degradé nuevo y lo tapa a pedazos.
      // Del OTRO tipo no tocamos nada suelto que haya podido sobrevivir
      // adentro del frag -si "preserved" lo encontró, lo vamos a
      // reconstruir prolijo aparte; si no lo encontró (selección
      // mezclada, con varios tramos del otro tipo), mejor dejar esos
      // pedazos como estaban que arriesgarnos a romperlos.
      frag.querySelectorAll(`[data-rainbow="${kind}"]`).forEach(el => stripRainbowStyle(el, kind));
      frag.querySelectorAll('font,[style],[color],[bgcolor]').forEach(el => {
        if(el.getAttribute('data-rainbow') && el.getAttribute('data-rainbow') !== kind) return;
        if(kind === 'fg'){
          el.style.removeProperty('color');
          el.style.removeProperty('-webkit-text-fill-color');
          el.removeAttribute('color');
        }else{
          el.style.removeProperty('background');
          el.style.removeProperty('background-color');
          el.removeAttribute('bgcolor');
        }
      });

      const finalNode = wrapKindPreservingOther(
        kind, frag, kind === 'fg' ? RAINBOW_FG_STYLE : RAINBOW_BG_STYLE, true, preserved
      );
      range.insertNode(finalNode);

      // Dejamos el cursor como un puntito simple justo después de lo
      // que acabamos de pintar, para poder seguir escribiendo normal.
      placeCollapsedCursorAfter(finalNode);

      return true;
    }catch(err){
      showRainbowDebugToast('error: ' + (err && err.message ? err.message : err));
      return false;
    }
  }

  // Mismo método que applyRainbowSmooth, pero para un color sólido -o
  // directamente sin estilo, para "sin color"-. Antes esta parte usaba
  // execCommand (hiliteColor/foreColor) sobre la selección; el problema
  // es que execCommand solo "sabe" tocar el formato que ÉL MISMO puso
  // antes, y sobre uno de nuestros <span> (los del arcoíris, ya
  // limpiados) a veces directamente no hace nada -de ahí que el botón
  // pareciera no andar-. Envolviendo el texto a mano, igual que con el
  // arcoíris, el resultado es siempre el mismo sin importar qué había
  // antes ahí.
  function applySolidStyle(kind, range, colorValue){
    if(!range || range.collapsed) return false;
    try{
      const otherKind = kind === 'fg' ? 'bg' : 'fg';
      const preserved = findEnclosingKindStyle(range, otherKind);

      isolateStyledAncestor(range);
      const frag = range.extractContents();
      if(!frag || !frag.textContent) return false;

      // Igual que en applyRainbowSmooth: solo limpiamos el arcoíris del
      // MISMO tipo que estamos por pisar, para no borrar sin querer un
      // arcoíris de letra al aplicar solo un fondo (o viceversa) -la
      // app tiene que poder combinar los dos-.
      frag.querySelectorAll(`[data-rainbow="${kind}"]`).forEach(el => stripRainbowStyle(el, kind));
      frag.querySelectorAll('font,[style],[color],[bgcolor]').forEach(el => {
        // Mismo cuidado que en applyRainbowSmooth: no tocar el arcoíris
        // del otro tipo que estamos preservando a propósito.
        if(el.getAttribute('data-rainbow') && el.getAttribute('data-rainbow') !== kind) return;
        if(kind === 'fg'){
          el.style.removeProperty('color');
          el.style.removeProperty('-webkit-text-fill-color');
          el.removeAttribute('color');
        }else{
          el.style.removeProperty('background');
          el.style.removeProperty('background-color');
          el.removeAttribute('bgcolor');
        }
      });

      // Si no hay colorValue (es "sin color"), el span del tipo actual
      // queda sin ningún estilo propio -el texto adentro ya viene
      // limpio por el paso de arriba-. De cualquier manera, si había
      // un estilo del OTRO tipo para conservar, wrapKindPreservingOther
      // se encarga de anidarlo bien.
      const currentStyleAttr = colorValue
        ? (kind === 'fg' ? `color:${colorValue};` : `background-color:${colorValue};`)
        : null;
      const wrapper = wrapKindPreservingOther(kind, frag, currentStyleAttr, false, preserved);
      range.insertNode(wrapper);

      placeCollapsedCursorAfter(wrapper);

      return true;
    }catch(err){
      return false;
    }
  }

  function applyRainbowBands(kind, range){
    if(!range || range.collapsed) return false;

    const totalLen = range.toString().length;
    if(totalLen === 0) return false;

    const bandCount = Math.min(RAINBOW_PALETTE.length, Math.max(2, totalLen));
    // Cuántos caracteres le tocan a cada franja (repartidos lo más
    // parejo posible sobre el total).
    const bandLens = [];
    let prevBound = 0;
    for(let b = 1; b <= bandCount; b++){
      const bound = Math.round(totalLen * b / bandCount);
      bandLens.push(bound - prevBound);
      prevBound = bound;
    }

    // "remaining" es la porción del texto que todavía nos falta pintar.
    // Arranca siendo igual a la selección original, y la vamos achicando
    // por el FINAL en cada vuelta (pintamos de atrás para adelante). El
    // arranque (start) de "remaining" nunca se toca durante todo el
    // proceso, así que sigue siendo una referencia válida siempre.
    let remaining = range.cloneRange();
    const sel = window.getSelection();
    let touched = false;

    for(let b = bandCount - 1; b >= 0; b--){
      const bandLen = bandLens[b];
      if(bandLen <= 0) continue;

      // Recalculamos TODO de cero acá, con el estado actual real del
      // DOM, en vez de confiar en offsets calculados antes de empezar
      // (que dejan de servir apenas la primera franja parte un nodo de
      // texto, sobre todo si la selección cruza el borde de un
      // comentario o de otro formato ya aplicado).
      const textNodes = getTextNodesInRange(remaining);
      if(!textNodes.length) break;
      const segments = textNodes.map(node => {
        const start = (node === remaining.startContainer) ? remaining.startOffset : 0;
        const end = (node === remaining.endContainer) ? remaining.endOffset : node.data.length;
        return {node, start, end, len: end - start};
      }).filter(s => s.len > 0);
      const remLen = segments.reduce((a, s) => a + s.len, 0);
      if(remLen <= 0) break;

      function posToNodeOffset(pos){
        let acc = 0;
        for(const s of segments){
          if(pos <= acc + s.len) return {node: s.node, offset: s.start + (pos - acc)};
          acc += s.len;
        }
        const last = segments[segments.length - 1];
        return {node: last.node, offset: last.end};
      }

      const splitPos = Math.max(0, remLen - bandLen);
      const from = posToNodeOffset(splitPos);
      const to = {node: remaining.endContainer, offset: remaining.endOffset};
      if(from.node === to.node && from.offset === to.offset){ continue; }

      const bandRange = document.createRange();
      bandRange.setStart(from.node, from.offset);
      bandRange.setEnd(to.node, to.offset);
      sel.removeAllRanges();
      sel.addRange(bandRange);
      const color = RAINBOW_PALETTE[b % RAINBOW_PALETTE.length];
      if(kind === 'fg'){
        document.execCommand('foreColor', false, color);
      }else{
        document.execCommand('hiliteColor', false, color);
      }
      touched = true;

      // Achicamos "remaining" para que termine justo donde arrancó esta
      // franja. from.node/from.offset siguen siendo válidos porque
      // quedan del lado que todavía no tocamos (el navegador corta los
      // nodos de texto EXACTAMENTE ahí, conservando intacta la parte de
      // "antes").
      const newRemaining = document.createRange();
      newRemaining.setStart(remaining.startContainer, remaining.startOffset);
      newRemaining.setEnd(from.node, from.offset);
      remaining = newRemaining;
    }

    // Dejamos la selección colapsada (un cursor simple, sin nada
    // "raro" de por medio) al final de todo lo que acabamos de tocar.
    // Usamos la selección VIVA tal cual quedó después de la última
    // operación (no las referencias originales, que ya están gastadas
    // por los cortes de texto que hicimos en el camino). Sin esto,
    // sospechamos que Android puede dejar la selección en un estado
    // confuso después de tantos cambios de rango seguidos, al punto de
    // no dejar volver a marcar texto con el dedo hasta recargar.
    if(sel.rangeCount){
      try{
        const liveRange = sel.getRangeAt(0);
        liveRange.collapse(false);
        sel.removeAllRanges();
        sel.addRange(liveRange);
      }catch(e){ /* si algo quedó raro, mejor no insistir */ }
    }
    return touched;
  }

  // Cuando estás escribiendo con el arcoíris activado y tocás OTRO color
  // (o "sacar"), la intención es "de acá en más escribo distinto", no
  // "borrame el arcoíris que ya escribí". Por eso, en vez de dejar que
  // la limpieza de más abajo le pise el estilo al span entero -que
  // incluiría lo ya tipeado, porque el cursor sigue technically "adentro"
  // de él-, movemos el cursor a JUSTO DESPUÉS de ese span primero: así
  // lo que ya está escrito en arcoíris queda intacto, y lo nuevo empieza
  // afuera, libre para el color que elijas.
  function exitRainbowTypingCleanly(){
    if(!rainbowTyping) return;
    const w = rainbowTyping.wrapper;
    rainbowTyping = null;
    if(!w || !w.parentNode) return;
    // Solo actuamos si el cursor TODAVÍA está adentro (o pegado) del
    // span donde veníamos escribiendo. Si mientras tanto ya
    // seleccionaste otra cosa en otro lado de la nota, no la tocamos.
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    const cur = sel.getRangeAt(0);
    if(!cur.collapsed) return;
    if(cur.startContainer !== w && !w.contains(cur.startContainer)) return;
    try{
      // Insertamos un carácter invisible SUELTO -sin ningún span con
      // estilo alrededor- justo después del recuadro del arcoíris, y
      // paramos el cursor ahí adentro. Antes solo movíamos el LÍMITE
      // de la selección hasta el borde del span (sin agregar nada), y
      // en algunos navegadores eso no alcanza: siguen tratando lo
      // próximo que tipees como si estuviera pegado al span de al
      // lado. Con un nodo de texto propio y sin estilo, no hay
      // ambigüedad posible: lo que escribas ahí sale limpio.
      const anchor = document.createTextNode('\u200B');
      w.parentNode.insertBefore(anchor, w.nextSibling);
      const r = document.createRange();
      r.setStart(anchor, 1);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
      savedRange = r.cloneRange();
    }catch(err){ /* si esto falla, mejor no insistir */ }
  }

  function applyFontColor(value){
    // Antes acá solo se llamaba a stopRainbowTyping() (apagar la
    // bandera). Ahora, además, sacamos el cursor de adentro del span
    // donde veníamos escribiendo -ver el comentario de arriba-.
    exitRainbowTypingCleanly();
    if(!value) return;
    if(lastFocusTarget === 'title'){
      if(value === 'rainbow'){
        const n = notes.find(x => x.id === currentId);
        // Los dos arcoíris (letra y fondo) no conviven: si el fondo
        // estaba en arcoíris, lo apagamos de forma prolija y visible en
        // vez de dejar su botón apretado sin efecto.
        if(n && n.titleBgColor === 'rainbow'){
          n.titleBgColor = '';
          document.getElementById('bgColorSwatch').style.background = '';
          titleEl.style.background = '';
          titleEl.style.webkitBackgroundClip = '';
          titleEl.style.backgroundClip = '';
          titleEl.style.filter = '';
          titleEl.style.boxShadow = '';
          titleEl.style.backgroundColor = '';
        }
        if(n) n.titleColor = 'rainbow';
        titleEl.style.setProperty('-webkit-text-fill-color', '');
        titleEl.style.setProperty('-webkit-text-stroke', '');
        titleEl.style.textShadow = '';
        titleEl.style.color = '';
        renderTitleRainbow();
        document.getElementById('fontColorSwatch').style.background = RAINBOW_GRADIENT;
        scheduleSave();
        return;
      }
      const n = notes.find(x => x.id === currentId);
      if(n && n.titleColor === 'rainbow'){
        // Sacamos los spans de color por letra y volvemos a un solo
        // nodo de texto plano antes de aplicar el color sólido.
        flattenTitleToPlainText();
      }
      titleEl.style.setProperty('-webkit-text-fill-color', '');
      titleEl.style.setProperty('-webkit-text-stroke', '');
      titleEl.style.textShadow = '';
      titleEl.style.color = value;
      if(n) n.titleColor = value;
      document.getElementById('fontColorSwatch').style.background = value;
      scheduleSave();
      return;
    }
    if(!savedRange || !bodyEl.contains(savedRange.commonAncestorContainer)) return;
    // Limpiamos el arcoíris viejo ACÁ, tocando solo el DOM (nada de
    // selección todavía). Antes esto pasaba después de restoreSelection(),
    // es decir con la selección del navegador ya "enganchada" -y mutar
    // atributos de estilo justo con una selección viva puesta encima es,
    // en algunos celulares, lo que hacía que el propio execCommand de
    // después se confundiera y borrara texto en vez de solo cambiarle el
    // color. Limpiando ANTES de tocar la selección, y recién after
    // volviendo a pararla, el execCommand siempre corre sobre una
    // selección fresca y un DOM ya prolijo.
    clearRainbowStylesInRange('fg', savedRange);
    if(value === 'rainbow'){
      if(savedRange.collapsed){
        if(!restoreSelection()) return;
        // No hay texto seleccionado: activamos el modo "arcoíris
        // mientras escribís", igual que pasa con los demás colores
        // cuando no hay nada resaltado.
        startRainbowTyping('fg');
        document.getElementById('fontColorSwatch').style.background = RAINBOW_GRADIENT;
        showRainbowDebugToast('activado para lo que escribas (letra). Andá tipeando.');
        return;
      }
      stopRainbowTyping();
      let ok = false;
      try{
        ok = applyRainbowSmooth('fg', savedRange);
        if(!ok) showRainbowDebugToast('no encontró texto para pintar (fg). ¿Había algo seleccionado?');
      }catch(err){
        showRainbowDebugToast('error en letra: ' + (err && err.message ? err.message : err));
      }
      if(ok){ document.getElementById('fontColorSwatch').style.background = RAINBOW_GRADIENT; scheduleSave(); }
      return;
    }
    stopRainbowTyping();
    if(savedRange.collapsed){
      // No hay nada seleccionado: dejamos el cursor "escribiendo
      // adentro" de un elemento con este color -no dependemos de que
      // el navegador se acuerde solo-.
      if(!restoreSelection()) return;
      startTypingWithStyle('fg', `color:${value};`, false);
      document.getElementById('fontColorSwatch').style.background = value;
      scheduleSave();
      return;
    }
    // Hay una selección de verdad: lo hacemos a mano (mismo método que
    // el arcoíris), no con execCommand.
    let okSolid = false;
    try{ okSolid = applySolidStyle('fg', savedRange, value); }catch(err){}
    if(okSolid){
      document.getElementById('fontColorSwatch').style.background = value;
      scheduleSave();
    }
  }

  function applyBgColor(value){
    // Mismo criterio que en applyFontColor: sacamos el cursor de adentro
    // del span donde veníamos escribiendo con arcoíris ANTES de nada,
    // para no borrar lo ya escrito.
    exitRainbowTypingCleanly();
    if(lastFocusTarget === 'title'){
      if(value === 'rainbow'){
        titleEl.style.setProperty('-webkit-text-fill-color', '');
        titleEl.style.webkitBackgroundClip = 'border-box';
        titleEl.style.backgroundClip = 'border-box';
        titleEl.style.background = RAINBOW_GRADIENT;
        titleEl.style.filter = 'saturate(1.6) brightness(1.15)';
        titleEl.style.boxShadow = '0 0 14px rgba(255,255,255,0.35)';
        const n = notes.find(x => x.id === currentId);
        // Los dos arcoíris no pueden convivir. Si la letra estaba en
        // arcoíris, la apagamos de forma prolija en vez de dejar su
        // botón apretado sin efecto visible.
        if(n && n.titleColor === 'rainbow'){
          n.titleColor = '';
          document.getElementById('fontColorSwatch').style.background = '';
          flattenTitleToPlainText();
          titleEl.style.color = '';
        }
        if(n) n.titleBgColor = 'rainbow';
        document.getElementById('bgColorSwatch').style.background = RAINBOW_GRADIENT;
        scheduleSave();
        return;
      }
      titleEl.style.filter = '';
      titleEl.style.boxShadow = '';
      titleEl.style.webkitBackgroundClip = '';
      titleEl.style.backgroundClip = '';
      // Si venía de un fondo arcoíris, la imagen del gradiente queda
      // colgada en el shorthand "background" y tapa cualquier color
      // sólido que pongamos encima si no la borramos primero.
      titleEl.style.background = '';
      titleEl.style.backgroundColor = value || '';
      const n = notes.find(x => x.id === currentId);
      if(n) n.titleBgColor = value || '';
      document.getElementById('bgColorSwatch').style.background = value || '';
      scheduleSave();
      return;
    }
    if(!savedRange || !bodyEl.contains(savedRange.commonAncestorContainer)) return;
    clearRainbowStylesInRange('bg', savedRange);
    if(value === 'rainbow'){
      if(savedRange.collapsed){
        if(!restoreSelection()) return;
        startRainbowTyping('bg');
        document.getElementById('bgColorSwatch').style.background = RAINBOW_GRADIENT;
        showRainbowDebugToast('activado para lo que escribas (fondo). Andá tipeando.');
        return;
      }
      stopRainbowTyping();
      let ok = false;
      try{
        ok = applyRainbowSmooth('bg', savedRange);
        if(!ok) showRainbowDebugToast('no encontró texto para pintar (bg). ¿Había algo seleccionado?');
      }catch(err){
        showRainbowDebugToast('error en fondo: ' + (err && err.message ? err.message : err));
      }
      if(ok){ document.getElementById('bgColorSwatch').style.background = RAINBOW_GRADIENT; scheduleSave(); }
      return;
    }
    stopRainbowTyping();
    if(savedRange.collapsed){
      if(!restoreSelection()) return;
      startTypingWithStyle('bg', value ? `background-color:${value};` : null, false);
      document.getElementById('bgColorSwatch').style.background = value || '';
      scheduleSave();
      return;
    }
    let okSolid = false;
    try{ okSolid = applySolidStyle('bg', savedRange, value || null); }catch(err){}
    if(okSolid){
      document.getElementById('bgColorSwatch').style.background = value || '';
      scheduleSave();
    }
  }

  // Menús desplegables propios (no <select> nativo) para tipografía y
  // tamaño. Usamos "mousedown" con preventDefault para que el foco (y la
  // selección de texto) nunca se le escape a noteBody, y "click" para
  // abrir el menú y elegir una opción de forma pareja en mouse y touch.
  function positionFbMenu(btn, menu){
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const r = btn.getBoundingClientRect();
    const menuW = menu.offsetWidth || 100;
    const menuH = menu.offsetHeight || 100;
    // Por defecto el menú se abre hacia arriba, alineado a la izquierda del botón.
    let left = r.left;
    let top = r.top - menuH - 6;
    // Si no entra hacia arriba (poco espacio), lo abrimos hacia abajo.
    if(top < 8){
      top = r.bottom + 6;
    }
    // Clampeamos siempre dentro de los límites visibles de la pantalla,
    // usando el viewport visual real (evita que quede "flotando" en
    // cualquier lado si justo se cerró el teclado y las medidas quedaron
    // desactualizadas).
    if(top + menuH > vh - 8){
      top = Math.max(8, vh - menuH - 8);
    }
    if(left + menuW > vw - 8){
      left = vw - menuW - 8;
    }
    left = Math.max(8, left);
    menu.style.left = Math.round(left) + 'px';
    menu.style.top = Math.round(top) + 'px';
    menu.style.bottom = 'auto';
  }
  function setupFbDropdown(ddId, onSelect){
    const dd = document.getElementById(ddId);
    const btn = dd.querySelector('.fb-dd-btn');
    const menu = dd.querySelector('.fb-dd-menu');
    // Sacamos el menú del format-bar (que tiene overflow-x:auto y lo recorta)
    // y lo colgamos directo del body, posicionado con JS.
    document.body.appendChild(menu);
    // Bloqueamos el comportamiento por defecto en TODA la superficie del
    // menú (no solo en los botones) usando mousedown -no touchstart, para
    // no romper el "click" táctil-: así, si el dedo toca el espacio vacío
    // entre círculos de color, tampoco le puede robar el foco al
    // título/cuerpo ni disparar el teclado/la barra flotante.
    menu.addEventListener('mousedown', e => e.preventDefault());
    const captureTarget = () => {
      // Se ejecuta lo antes posible (touchstart, antes que mousedown/click)
      // para ganarle a cualquier blur nativo del teclado que el toque
      // pueda disparar antes de que corra el resto de nuestro código.
      if(document.activeElement === titleEl) lastFocusTarget = 'title';
      else if(document.activeElement === bodyEl) lastFocusTarget = 'body';
      captureSelectionNow();
    };
    btn.addEventListener('touchstart', captureTarget, {passive:true});
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      captureTarget();
    });
    btn.addEventListener('click', () => {
      const willOpen = !dd.classList.contains('open');
      document.querySelectorAll('.fb-dd.open').forEach(o => o.classList.remove('open'));
      document.querySelectorAll('.fb-dd-menu.fb-dd-menu-open').forEach(m => m.classList.remove('fb-dd-menu-open'));
      if(willOpen){
        dd.classList.add('open');
        menu.classList.add('fb-dd-menu-open');
        positionFbMenu(btn, menu);
        requestAnimationFrame(() => { if(dd.classList.contains('open')) positionFbMenu(btn, menu); });
      }
    });
    menu.querySelectorAll('.fb-dd-item').forEach(item => {
      item.addEventListener('mousedown', e => e.preventDefault());
      item.addEventListener('click', () => {
        onSelect(item.dataset.value, item.textContent.trim());
        dd.classList.remove('open');
        menu.classList.remove('fb-dd-menu-open');
      });
    });
    window.addEventListener('resize', () => { if(dd.classList.contains('open')) positionFbMenu(btn, menu); });
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', () => { if(dd.classList.contains('open')) positionFbMenu(btn, menu); });
    }
    document.addEventListener('click', e => {
      if(!dd.contains(e.target) && !menu.contains(e.target)){
        dd.classList.remove('open');
        menu.classList.remove('fb-dd-menu-open');
      }
    });
  }
  setupFbDropdown('fontFamilyDD', (value, label) => {
    applyFontFamily(value);
    document.getElementById('fontFamilyLabel').textContent = label;
  });
  setupFbDropdown('fontSizeDD', (value, label) => {
    applyFontSize(value);
    document.getElementById('fontSizeLabel').textContent = label;
  });
  setupFbDropdown('fontColorDD', (value) => {
    applyFontColor(value);
  });
  setupFbDropdown('bgColorDD', (value) => {
    applyBgColor(value);
  });
  document.getElementById('backBtn').addEventListener('click', closeEditor);
  // Ninguno de estos botones del encabezado (guardar, copiar, importante,
  // quemar) debe robarle el foco al título o al cuerpo: si lo hiciera, la
  // barra de formato flotante se "bajaría" de golpe (volviendo a su
  // posición normal, arriba, pegada al título) aunque el teclado real
  // siga abierto tapando la pantalla - dando la sensación de que la barra
  // "salta" al tocar ese botón.
  ['backBtn','saveBtn','copyBtn','importantBtn','burnBtn'].forEach(id => {
    document.getElementById(id).addEventListener('mousedown', e => e.preventDefault());
  });
  document.getElementById('saveBtn').addEventListener('click', saveNow);
  document.getElementById('copyBtn').addEventListener('click', copyForWord);
  document.getElementById('importantBtn').addEventListener('click', () => {
    const n = notes.find(x => x.id === currentId);
    if(!n) return;
    n.important = !n.important;
    document.getElementById('importantBtn').classList.toggle('active', n.important);
    scheduleSave();
  });
  document.getElementById('burnBtn').addEventListener('click', () => burnModal.classList.add('show'));
  document.getElementById('burnCancel').addEventListener('click', () => burnModal.classList.remove('show'));
  document.getElementById('burnConfirm').addEventListener('click', burnNote);
  document.getElementById('itemDeleteCancel').addEventListener('click', () => {
    pendingDeleteId = null;
    itemDeleteModal.classList.remove('show');
  });
  document.getElementById('itemDeleteConfirm').addEventListener('click', confirmDeleteNote);

  // Botoncito "Nota" dentro de un resaltado: abre la carilla para
  // escribir/editar la nota de ese fragmento. preventDefault en
  // pointerdown/mousedown evita que el toque intente meter el cursor
  // dentro del botón (que es contenteditable="false") antes de que
  // llegue el click.
  bodyEl.addEventListener('pointerdown', e => {
    if(e.target.closest('.comment-note-btn')) e.preventDefault();
  });
  bodyEl.addEventListener('mousedown', e => {
    if(e.target.closest('.comment-note-btn')) e.preventDefault();
  });
  bodyEl.addEventListener('click', e => {
    const btn = e.target.closest('.comment-note-btn');
    if(!btn) return;
    e.preventDefault();
    e.stopPropagation();
    openNotePanel(btn.closest('.comment-mark'));
  });
  document.getElementById('noteCancel').addEventListener('click', closeNotePanel);
  document.getElementById('noteDelete').addEventListener('click', deleteNotePanel);
  document.getElementById('noteSave').addEventListener('click', saveNotePanel);
  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', e => {
    if(e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = '';
  });

  const iconMoon = document.getElementById('iconMoon');
  const iconSun = document.getElementById('iconSun');
  function setThemeIcon(light){
    iconMoon.classList.toggle('icon-visible', !light);
    iconSun.classList.toggle('icon-visible', light);
  }
  // Estos botones se pueden tocar mientras estás escribiendo (con el
  // teclado abierto). Sin este freno, el toque les roba el foco al título
  // o al cuerpo, el teclado se cierra de golpe y la barra flotante
  // "salta" a su posición normal (arriba, debajo del título) en vez de
  // quedarse donde estaba. preventDefault en pointerdown evita que el
  // botón tome el foco, así el teclado y la barra quedan como estaban.
  ['themeToggle', 'saveBtn', 'copyBtn'].forEach(id => {
    document.getElementById(id).addEventListener('pointerdown', e => e.preventDefault());
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    const light = document.body.classList.toggle('theme-light');
    setThemeIcon(light);
    localStorage.setItem(THEME_KEY, light ? 'light' : 'dark');
  });
  if(localStorage.getItem(THEME_KEY) === 'light'){
    document.body.classList.add('theme-light');
    setThemeIcon(true);
  }

  load();
  render();
  syncPull(); // trae notas nuevas de otros dispositivos, si hay conexión
})();
</script>

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>

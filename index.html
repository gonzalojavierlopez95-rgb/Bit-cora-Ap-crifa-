<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>Bitácora Apócrifa</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Pirata+One&display=swap');

  :root{
    --void:#0b0908;
    --void-2:#161210;
    --parchment:#e7ddc4;
    --parchment-dim:#b8ab8c;
    --blood:#7a1414;
    --blood-bright:#a52424;
    --gold:#c9a227;
    --gold-dim:#7a611c;
    --line:#3a322a;
  }
  body.theme-light{
    --void:#efe4c8;
    --void-2:#f8f0dc;
    --parchment:#2c2013;
    --parchment-dim:#6e5c3e;
    --blood:#8a1a1a;
    --blood-bright:#a52424;
    --gold:#8a6a14;
    --gold-dim:#a9871f;
    --line:#cbb98c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow:hidden; touch-action:pan-y;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(122,20,20,0.20), transparent 55%),
      radial-gradient(ellipse at 10% 110%, rgba(122,20,20,0.12), transparent 50%),
      var(--void);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    height:100vh;
    height:100dvh;
    -webkit-tap-highlight-color:transparent;
  }

  .book{
    max-width:640px;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:1.1rem 0.5rem calc(0.7rem + env(safe-area-inset-bottom, 0px));
    position:relative;
  }

  header{text-align:center; margin-bottom:0.7rem; flex-shrink:0;}
  h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:1.8rem;
    letter-spacing:0.08em;
    margin:0;
    color:var(--parchment);
    text-shadow:0 0 18px rgba(165,36,36,0.35);
  }
  header .sub{
    font-family:'Cinzel', serif;
    font-size:0.65rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:0.35rem;
  }
  header::after{
    content:'';
    display:block;
    width:120px;
    height:1px;
    margin:0.6rem auto 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .theme-toggle{
    all:unset;
    cursor:pointer;
    position:absolute;
    top:0.9rem;
    right:0.55rem;
    z-index:15;
    width:2.05rem;
    height:2.05rem;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--void-2);
    border:1.5px solid var(--gold);
    border-radius:50%;
    color:var(--gold);
    transition:box-shadow 0.25s ease, transform 0.15s ease;
  }
  .theme-toggle:hover{
    box-shadow:0 0 8px rgba(201,162,39,0.35);
  }
  .theme-toggle:active{transform:scale(0.92);}
  .theme-toggle .icon-stage{
    position:relative;
    width:1.3rem;
    height:1.3rem;
  }
  .theme-toggle svg{
    position:absolute;
    top:0;
    left:0;
    width:1.3rem;
    height:1.3rem;
    display:block;
    opacity:0;
    transform:scale(0.5) rotate(-90deg);
    transition:opacity 0.3s ease, transform 0.35s ease;
    pointer-events:none;
  }
  .theme-toggle svg.icon-visible{
    opacity:1;
    transform:scale(1) rotate(0deg);
  }

  input, textarea{
    font-family:'EB Garamond', serif;
    background:var(--void-2);
    border:1px solid var(--line);
    color:var(--parchment);
    border-radius:3px;
    outline:none;
  }
  input::placeholder, textarea::placeholder{color:var(--parchment-dim); font-style:italic;}
  input:focus, textarea:focus{border-color:var(--gold);}

  button{font-family:inherit;}

  /* ---------- vista lista ---------- */
  #viewList{display:flex; flex-direction:column; flex:1; min-height:0;}
  .search-wrap{position:relative; flex-shrink:0; margin-bottom:0.8rem;}
  .search-wrap svg{
    position:absolute; left:0.7rem; top:50%; transform:translateY(-50%);
    width:1rem; height:1rem; color:var(--gold-dim); pointer-events:none;
  }
  #search{width:100%; padding:0.7rem 0.8rem 0.7rem 2.1rem; font-size:0.85rem;}

  #list{flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;}
  #list::-webkit-scrollbar{display:none;}

  .note-item{
    display:flex;
    gap:0.7rem;
    padding:0.9rem 0.3rem;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    position:relative;
  }
  .note-item:active{background:rgba(201,162,39,0.06);}
  .note-item .bar{
    width:2px;
    flex-shrink:0;
    background:linear-gradient(var(--gold), transparent);
    border-radius:2px;
  }
  .note-item .content{min-width:0; flex:1;}
  .note-title{
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:1rem;
    color:var(--parchment);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:inline-block;
    max-width:calc(100% - 2.8rem);
    vertical-align:top;
    padding:0.05rem 1.4rem 0.05rem 0.3rem;
    margin:-0.05rem -0.3rem;
    border-radius:2px;
  }
  .note-preview{
    font-size:0.9rem;
    color:var(--parchment-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:0.2rem;
    padding-right:2.8rem;
  }
  .note-date{
    font-family:'Cinzel', serif;
    font-size:0.6rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-top:0.55rem;
  }

  .item-menu-btn{
    all:unset;
    cursor:pointer;
    position:absolute;
    top:50%;
    right:0.2rem;
    transform:translateY(-50%);
    width:2.1rem;
    height:2.1rem;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    background:rgba(201,162,39,0.1);
    border-radius:50%;
    flex-shrink:0;
  }
  .item-menu-btn:active{background:rgba(201,162,39,0.22); color:var(--gold);}
  .item-menu-btn svg{width:1.3rem; height:1.3rem;}

  .item-menu{
    display:none;
    position:absolute;
    top:calc(50% + 1.3rem);
    right:0.2rem;
    background:var(--void-2);
    border:1px solid var(--gold-dim);
    border-radius:4px;
    min-width:9rem;
    z-index:30;
    box-shadow:0 8px 20px rgba(0,0,0,0.55);
    overflow:hidden;
  }
  .item-menu.show{display:block;}
  .item-menu-option{
    all:unset;
    display:block;
    width:100%;
    box-sizing:border-box;
    padding:0.7rem 0.9rem;
    font-family:'Cinzel', serif;
    font-size:0.72rem;
    letter-spacing:0.04em;
    color:var(--parchment);
    cursor:pointer;
  }
  .item-menu-option:active{background:rgba(201,162,39,0.1);}
  .item-menu-option + .item-menu-option{border-top:1px solid var(--line);}
  .item-menu-option.danger{color:var(--blood-bright);}

  .empty{
    text-align:center;
    color:var(--parchment-dim);
    font-style:italic;
    padding:2.6rem 1rem;
    border:1px dashed var(--line);
    margin-top:1rem;
  }

  .fab{
    all:unset;
    cursor:pointer;
    position:absolute;
    right:1.2rem;
    bottom:calc(1.2rem + env(safe-area-inset-bottom, 0px));
    width:2.9rem;
    height:2.9rem;
    border-radius:50%;
    background:var(--blood);
    border:1px solid var(--blood-bright);
    color:var(--parchment);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 18px rgba(122,20,20,0.55);
    z-index:20;
  }
  .fab:active{background:var(--blood-bright);}
  .fab svg{width:1.3rem; height:1.3rem;}

  /* Línea que sale del centro del botón + al escrolear hacia abajo,
     con un destello sutil que sube. Puramente decorativo: pointer-
     events:none para que nunca estorbe al toque. */
  .fab-scan-line{
    position:absolute;
    right:calc(1.2rem + 2.9rem);
    left:0;
    bottom:calc(1.2rem + env(safe-area-inset-bottom, 0px) + 1.45rem);
    height:0;
    pointer-events:none;
    z-index:19;
    overflow:visible;
  }
  .fab-scan-line::before{
    content:'';
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:1px;
    background:var(--blood-bright);
    transform-origin:right center;
    transform:scaleX(0);
    opacity:0;
  }
  .fab-scan-line.active::before{
    animation:fabLaserTravel 0.45s cubic-bezier(0.3,0.7,0.2,1) forwards;
  }
  @keyframes fabLaserTravel{
    0%{transform:scaleX(0); opacity:0.5;}
    100%{transform:scaleX(1); opacity:0.85;}
  }
  .fab-scan-line::after{
    content:'';
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:70px;
    background:linear-gradient(to top, rgba(122,20,20,0.28), transparent 85%);
    opacity:0;
    filter:blur(4px);
  }
  .fab-scan-line.active::after{
    animation:fabLaserFlash 0.6s ease-out 0.42s;
  }
  @keyframes fabLaserFlash{
    0%{opacity:0; transform:translateY(0);}
    18%{opacity:0.45; transform:translateY(0);}
    100%{opacity:0; transform:translateY(-46px);}
  }

  .backup-row{
    display:flex;
    justify-content:center;
    gap:1.2rem;
    padding-top:0.7rem;
    padding-right:2.1rem;
    box-sizing:border-box;
    flex-shrink:0;
  }
  .backup-btn{
    all:unset;
    cursor:pointer;
    font-family:'Cinzel', serif;
    font-size:0.6rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold-dim);
    padding:0.3rem 0;
    border-bottom:1px solid transparent;
  }
  .backup-btn:hover{color:var(--gold); border-color:var(--gold);}

  /* ---------- vista editor ---------- */
  #viewEditor{display:none; flex-direction:column; flex:1; min-height:0;}
  .editor-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
    margin-bottom:0.6rem;
    padding-right:3.4rem;
  }
  .editor-top-right{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:1 1 auto;
    gap:1.1rem;
  }
  .save-btn{
    all:unset;
    cursor:pointer;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:0.62rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--void);
    background:var(--gold);
    padding:0.4rem 0.7rem;
    border-radius:2px;
  }
  .save-btn:active{background:var(--gold-dim);}
  .icon-btn{
    all:unset;
    cursor:pointer;
    width:2.1rem;
    height:2.1rem;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
  }
  .icon-btn svg{width:1.2rem; height:1.2rem;}
  .icon-btn.burn{color:var(--blood-bright);}
  .icon-btn.important-btn.active{
    color:#ff1744;
    filter:drop-shadow(0 0 4px rgba(255,23,68,0.85));
  }
  .icon-btn.important-btn.active svg{fill:#ff1744; fill-opacity:0.25;}
  @keyframes neonPulseRed{
    0%, 100%{
      color:#ff1744;
      text-shadow:0 0 4px rgba(255,23,68,0.65), 0 0 9px rgba(255,23,68,0.4);
    }
    50%{
      color:#ff5c7a;
      text-shadow:0 0 11px rgba(255,23,68,1), 0 0 20px rgba(255,23,68,0.85);
    }
  }
  .note-date.important{
    animation:neonPulseRed 1.3s ease-in-out infinite;
  }
  .save-flag{
    font-family:'Cinzel', serif;
    font-size:0.58rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold-dim);
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .save-flag.show{opacity:1;}

  .title-wrap{
    position:relative;
    flex-shrink:0;
    margin-bottom:0.5rem;
  }
  #noteTitle{
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:1.15rem;
    padding:0.7rem 4.2rem 0.7rem 0.8rem;
    margin-bottom:0;
    width:100%;
    flex-shrink:0;
    caret-color:var(--gold);
    background:var(--void-2);
    border:1px solid var(--line);
    color:var(--parchment);
    border-radius:3px;
    outline:none;
    white-space:nowrap;
    overflow-x:auto;
    touch-action:pan-x;
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right, black calc(100% - 4.3rem), transparent 100%);
    mask-image:linear-gradient(to right, black calc(100% - 4.3rem), transparent 100%);
    -webkit-text-stroke:0.4px rgba(140,130,108,0.55);
  }
  #noteTitle::-webkit-scrollbar{display:none;}
  #noteTitle:focus{border-color:var(--gold);}
  #noteTitle:empty:before{
    content:attr(data-placeholder);
    color:var(--parchment-dim);
    font-style:italic;
  }
  .title-actions{
    position:absolute;
    right:1px;
    top:1px;
    bottom:1px;
    display:flex;
    align-items:center;
    gap:0.1rem;
    padding-right:0.25rem;
    padding-left:0.8rem;
    background:linear-gradient(to right, transparent, var(--void-2) 1rem);
    border-radius:0 2px 2px 0;
  }
  .title-action-btn{
    all:unset;
    cursor:pointer;
    width:1.7rem;
    height:1.7rem;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:3px;
    color:var(--blood-bright);
    transition:color 0.15s ease, background 0.15s ease;
  }
  .title-action-btn:active{
    color:var(--blood-bright);
    background:rgba(165,36,36,0.15);
  }
  .title-action-btn svg{width:1.15rem; height:1.15rem;}
  .note-body-wrap{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  #noteBody{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:0.9rem 0.35rem 2.4rem;
    font-size:1rem;
    line-height:1.7;
    white-space:pre-wrap;
    word-wrap:break-word;
    caret-color:var(--gold);
    outline:none;
    touch-action:pan-y;
    scrollbar-width:none;
    -ms-overflow-style:none;
    -webkit-text-stroke:0.35px rgba(140,130,108,0.4);
  }
  #noteBody::-webkit-scrollbar{display:none;}
  .scroll-thumb{
    position:absolute;
    right:-0.45rem;
    top:0;
    width:1.3rem;
    height:2.5rem;
    border-radius:999px;
    background:rgba(15,10,8,0.88);
    border:1px solid var(--gold-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    touch-action:none;
    z-index:5;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .scroll-thumb svg{width:0.85rem; height:0.85rem;}
  .scroll-thumb.visible{opacity:1; pointer-events:auto;}
  .scroll-thumb.dragging{
    opacity:1;
    pointer-events:auto;
    transition:none;
    border-color:var(--gold);
    background:rgba(15,10,8,0.96);
  }
  #noteBody:empty:before{
    content:attr(data-placeholder);
    color:var(--parchment-dim);
    font-style:italic;
  }
  #noteBody font[size="7"]{
    font-size:1em; /* resguardo: el JS reemplaza esto al toque por el tamaño real elegido */
  }
  #noteBody b, #noteBody strong{
    font-weight:700;
  }
  .format-bar{
    display:flex;
    gap:0.4rem;
    flex-shrink:0;
    margin-bottom:0.5rem;
    outline:none;
  }
  .format-btn{
    all:unset;
    cursor:pointer;
    width:2rem;
    height:2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--parchment-dim);
    font-family:'EB Garamond', serif;
    font-size:0.95rem;
    outline:none;
    background:var(--void-2);
  }
  .format-btn[data-cmd="bold"]{font-weight:700;}
  .format-btn[data-cmd="italic"]{font-style:italic;}
  .format-btn[data-cmd="underline"]{text-decoration:underline;}
  .format-btn[data-cmd="strikeThrough"]{text-decoration:line-through;}
  .format-btn:active{background:rgba(201,162,39,0.12);}
  .format-btn.active{
    color:var(--gold);
    border-color:var(--gold);
    background:rgba(201,162,39,0.1);
  }
  .format-btn svg{width:1.05rem; height:1.05rem;}
  .format-bar{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:0.15rem;
  }
  .format-bar::-webkit-scrollbar{display:none;}
  .format-bar .format-btn,
  .format-bar .fb-select{flex-shrink:0;}
  .fb-sep{
    width:1px;
    align-self:stretch;
    background:var(--line);
    flex-shrink:0;
    margin:0 0.1rem;
  }
  .fb-select{
    all:unset;
    cursor:pointer;
    box-sizing:border-box;
    height:2rem;
    max-width:6.4rem;
    padding:0 0.4rem;
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--parchment-dim);
    font-family:'EB Garamond', serif;
    font-size:0.78rem;
    outline:none;
    background:var(--void-2);
  }
  .fb-select:focus{border-color:var(--gold); color:var(--gold);}
  .fb-dd{position:relative; flex-shrink:0;}
  .fb-dd-btn{
    all:unset;
    cursor:pointer;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:0.3rem;
    height:2rem;
    padding:0 0.6rem;
    border-radius:999px;
    background:var(--void);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:0.85rem;
  }
  .fb-dd-btn:active, .fb-dd.open .fb-dd-btn{background:#000;}
  .fb-dd-btn-size{min-width:2.6rem; justify-content:center; font-weight:600; font-size:0.9rem;}
  .fb-dd-arrow{width:0.7rem; height:0.7rem; flex-shrink:0;}
  .fb-dd-menu{
    display:none;
    position:fixed;
    min-width:6.5rem;
    max-height:14rem;
    overflow-y:auto;
    background:var(--void-2);
    border:1px solid var(--gold-dim);
    border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,0.5);
    padding:0.3rem;
    z-index:500;
  }
  .fb-dd-menu.fb-dd-menu-open{display:block;}
  .fb-dd-item{
    all:unset;
    display:block;
    box-sizing:border-box;
    width:100%;
    cursor:pointer;
    padding:0.45rem 0.6rem;
    border-radius:5px;
    color:var(--parchment);
    font-size:0.9rem;
    text-align:center;
  }
  .fb-dd-item:active, .fb-dd-item:hover{background:rgba(201,162,39,0.15); color:var(--gold);}
  .fb-dd-btn-color{
    gap:0.3rem;
    padding:0 0.5rem;
  }
  .fc-icon{
    font-family:'EB Garamond', serif;
    font-weight:700;
    font-size:0.95rem;
    line-height:1;
  }
  .fc-icon-bg{
    padding:0 0.2rem;
    border-radius:2px;
    background:rgba(231,221,196,0.18);
  }
  .fc-swatch{
    width:0.9rem;
    height:0.22rem;
    border-radius:1px;
    background:var(--parchment);
    flex-shrink:0;
  }
  .fb-dd-menu-colors{
    display:none;
    padding:0.5rem;
    grid-template-columns:repeat(4, 1.7rem);
    gap:0.5rem;
  }
  .fb-dd-menu-colors.fb-dd-menu-open{display:grid;}
  .fb-color-item{
    all:unset;
    box-sizing:border-box;
    cursor:pointer;
    width:1.7rem;
    height:1.7rem;
    border-radius:50%;
    border:1.5px solid var(--line);
  }
  .fb-color-item:active{border-color:var(--gold); transform:scale(0.92);}
  .fb-color-none{
    background:linear-gradient(to top right, transparent calc(50% - 1px), var(--blood-bright), transparent calc(50% + 1px));
  }
  .format-bar.floating{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    padding:0.3rem 0.5rem calc(0.3rem + env(safe-area-inset-bottom, 0px));
    background:var(--void-2);
    border-top:1px solid var(--line);
    box-shadow:0 -6px 18px rgba(0,0,0,0.4);
    z-index:80;
  }
  .bar-pin-btn svg{transition:transform 0.2s;}
  .bar-pin-btn.pinned-down svg{transform:rotate(180deg);}
  .comment-btn{
    width:auto;
    padding:0 0.6rem;
    font-size:0.78rem;
    font-style:italic;
    color:var(--parchment-dim);
    gap:0.3rem;
  }
  .comment-btn.active{
    color:#1c3540;
    border-color:#8fb2c0;
    background:#a9c9d6;
  }
  .comment-mark{
    background:#b7b7b2;
    color:#2a2a28;
    -webkit-text-fill-color:#2a2a28 !important;
    border-top:1px solid var(--blood-bright);
    border-bottom:1px solid var(--blood-bright);
    border-left:1px solid var(--blood-bright);
    border-radius:2px;
    padding:0.15em 0.15em;
    position:relative;
  }
  .comment-mark:not(:empty)::after{
    content:none;
  }
  .comment-note-btn{
    all:unset;
    display:inline-block;
    cursor:pointer;
    margin-left:0.5em;
    padding:0.15em 0.4em;
    font-family:'Cinzel', serif;
    font-size:0.62em;
    font-style:normal;
    font-weight:600;
    letter-spacing:0.08em;
    color:#f4ead0;
    background:var(--blood);
    border-radius:2px;
    vertical-align:middle;
    -webkit-user-select:none;
    user-select:none;
    animation:noteBadgePulse 1.6s ease-in-out infinite;
    /* Si el botón queda anidado adentro de un span de arcoíris de
       letra, ese span hereda "-webkit-text-fill-color:transparent"
       hacia sus hijos -y como es una propiedad heredada, "gana" por
       encima del color normal del botón, dejando el texto invisible
       aunque el color esté bien puesto. Lo forzamos acá con
       !important para que el botón SIEMPRE se vea, sin importar qué
       arcoíris lo rodee. */
    -webkit-text-fill-color:#f4ead0 !important;
  }
  .comment-note-btn:active{transform:scale(0.88);}
  .comment-mark.has-note .comment-note-btn{
    animation:none;
    background:var(--gold);
    color:#2a1a05;
    -webkit-text-fill-color:#2a1a05 !important;
  }
  @keyframes noteBadgePulse{
    0%, 100%{opacity:1;}
    50%{opacity:0.45;}
  }
  body.theme-light .comment-mark{
    background:#d6d6d0;
    color:#2a2a28;
    -webkit-text-fill-color:#2a2a28 !important;
  }

  /* ---------- modal quemar ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:1rem;

  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--void-2);
    border:1px solid var(--gold);
    border-radius:4px;
    padding:1.4rem;
    max-width:20rem;
    text-align:center;

  .modal-box p{margin:0 0 1rem; font-style:italic; color:var(--parchment);}
  .modal-overlay:has(.note-box){padding:0;}
  .modal-box.note-box{
    max-width:none;
    width:100%;
    height:100%;
    text-align:left;
    border:none;
    border-bottom:1px solid rgba(255,36,54,0.35);
    border-radius:0;
    display:flex;
    flex-direction:column;
    padding:1.4rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom));

    font-size:1rem;
    letter-spacing:0.08em;

    flex:0 0 auto;
  }
  #noteTextarea{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    resize:none;
    padding:0.8rem;
    font-size:1rem;
    line-height:1.5;
    margin-bottom:1rem;
    box-sizing:border-box;
  }
  .modal-actions .danger{border-color:var(--blood-bright); color:var(--blood-bright);}
  .modal-actions .danger:hover{background:var(--blood-bright); color:var(--parchment);}
  .modal-actions{display:flex; gap:0.8rem; justify-content:center; flex:0 0 auto;}
  .modal-actions button{
    all:unset;
    cursor:pointer;
    font-family:'Cinzel', serif;
    font-size:0.65rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:0.55rem 1rem;

  .modal-actions .confirm{border-color:var(--blood-bright); color:var(--blood-bright);}
  .modal-actions .confirm:hover{background:var(--blood-bright); color:var(--parchment);}
  .modal-actions .cancel{color:var(--parchment-dim);}
  .modal-actions .cancel:hover{color:var(--parchment);}

  #importFile{display:none;}
</style>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
      </button>
      <button class="format-btn" data-cmd="justifyFull" type="button" title="Justificar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>

    <div class="note-body-wrap">
      <div id="noteBody" contenteditable="true" data-placeholder="Consigná lo que el instante te dicte..." spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" writingsuggestions="false"></div>
      <div class="scroll-thumb" id="scrollThumb" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </div>
    </div>
  </div>

  <!-- MODAL QUEMAR -->
  <div class="modal-overlay" id="burnModal">
    <div class="modal-box">
      <p>¿Reducir esta página a cenizas?<br>No hay vuelta atrás.</p>
      <div class="modal-actions">
        <button class="cancel" id="burnCancel" type="button">Conservar</button>
        <button class="confirm" id="burnConfirm" type="button">Quemar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ELIMINAR DESDE LA LISTA -->
  <div class="modal-overlay" id="itemDeleteModal">
    <div class="modal-box">
      <p>¿Eliminar este registro?<br>No hay vuelta atrás.</p>
      <div class="modal-actions">
        <button class="cancel" id="itemDeleteCancel" type="button">Conservar</button>
        <button class="confirm" id="itemDeleteConfirm" type="button">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- MODAL NOTA (carilla para escribir sobre el fragmento resaltado) -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal-box note-box">
      <h3>Nota apócrifa</h3>
      <textarea id="noteTextarea" placeholder="Escribí aquí tu nota sobre este fragmento..."></textarea>
      <div class="modal-actions">
        <button class="cancel" id="noteCancel" type="button">Cancelar</button>
        <button class="danger" id="noteDelete" type="button">Borrar nota</button>
        <button class="confirm" id="noteSave" type="button">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'bitacora_apocrifa_notes';
  const THEME_KEY = 'bitacora_apocrifa_theme';

  const viewList = document.getElementById('viewList');
  const viewEditor = document.getElementById('viewEditor');
  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');
  const titleEl = document.getElementById('noteTitle');
  const bodyEl = document.getElementById('noteBody');
  // Algunos navegadores/WebViews de Android (como el interno de ciertos
  // gestores de archivos) no alcanzan a apagar el corrector ortográfico
  // del todo solo con el atributo HTML "spellcheck" -hace falta además
  // asignar la propiedad por código para que la desactivación pegue de
  // verdad y no aparezca más el subrayado con sugerencias.
  [titleEl, bodyEl].forEach(el => {
    el.spellcheck = false;
    el.setAttribute('autocorrect', 'off');
    el.setAttribute('autocapitalize', 'off');
  });
  const saveFlag = document.getElementById('saveFlag');
  const burnModal = document.getElementById('burnModal');
  const itemDeleteModal = document.getElementById('itemDeleteModal');

  let notes = [];
  let currentId = null;
  let lastFocusTarget = 'body';
  let pendingDeleteId = null;
  let saveTimer = null;
  let flagTimer = null;

  // ---- Historial propio de deshacer/rehacer ----
  // Las flechas rojas usaban document.execCommand('undo'/'redo'), que
  // depende PURA Y EXCLUSIVAMENTE de la pila nativa del navegador. El
  // problema: el arcoíris (y cualquier otra cosa que armamos a mano con
  // extractContents()/TreeWalker, o con innerHTML directo) NUNCA queda
  // anotada en esa pila nativa, porque no pasa por execCommand. Resultado:
  // tocás deshacer después de un arcoíris y no pasa nada (o deshace otra
  // cosa vieja que sí había quedado registrada). Por eso armamos acá un
  // historial propio que guarda "fotos" (título+cuerpo) y sí lo captura
  // absolutamente todo, venga de donde venga el cambio.
  const MAX_HISTORY = 100;
  let history = [];
  let historyIndex = -1;
  let restoringHistory = false; // evita que restaurar una foto genere otra foto
  let historyDebounceTimer = null;

  function historySnapshot(){
    return { title: titleEl.innerHTML, body: bodyEl.innerHTML };
  }

  function pushHistory(){
    if(restoringHistory) return;
    const snap = historySnapshot();
    const last = history[historyIndex];
    if(last && last.title === snap.title && last.body === snap.body) return;
    // si el usuario había deshecho y ahora hace algo nuevo, se pisa el
    // "futuro" que había quedado colgado (igual que cualquier editor)
    history = history.slice(0, historyIndex + 1);
    history.push(snap);
    if(history.length > MAX_HISTORY) history.shift();
    historyIndex = history.length - 1;
  }

  function pushHistoryDebounced(){
    clearTimeout(historyDebounceTimer);
    historyDebounceTimer = setTimeout(pushHistory, 400);
  }

  function resetHistory(){
    clearTimeout(historyDebounceTimer);
    history = [historySnapshot()];
    historyIndex = 0;
  }

  function caretToEnd(el){
    el.focus();
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  function restoreHistorySnapshot(snap){
    restoringHistory = true;
    titleEl.innerHTML = snap.title;
    bodyEl.innerHTML = snap.body;
    attachNoteButtons();
    restoringHistory = false;
    // OJO: antes acá se llamaba a caretToEnd(...), que hace .focus()
    // sobre el título o el cuerpo para dejar el cursor listo para
    // seguir escribiendo. El problema es que ese .focus() -al pasar
    // dentro del mismo click del botón- cuenta como gesto del usuario
    // y el navegador levanta el teclado, tapando media nota justo
    // cuando lo que querés es VER qué cambió. Ahora, en cambio, sacamos
    // el foco a propósito (blur) de lo que haya quedado enfocado, para
    // que el teclado se esconda y la nota se vea completa. Si el
    // usuario quiere seguir escribiendo, toca la nota de nuevo y ahí sí
    // vuelve a aparecer el teclado, como es normal.
    titleEl.blur();
    bodyEl.blur();
    updateFormatState();
    scheduleSave();
  }

  function doUndo(){
    clearTimeout(historyDebounceTimer);
    pushHistory();
    if(historyIndex <= 0) return;
    historyIndex--;
    restoreHistorySnapshot(history[historyIndex]);
  }

  function doRedo(){
    if(historyIndex >= history.length - 1) return;
    historyIndex++;
    restoreHistorySnapshot(history[historyIndex]);
  }

  function load(){
    try{ notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ notes = []; }
  }
  function persist(skipCloudPush){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    if(!skipCloudPush){
      const current = notes.find(n => n.id === currentId);
      if(current) scheduleCloudPush(current);
    }
  }

  // ====== SINCRONIZACIÓN CON LA NUBE (Cloudflare Worker + D1) ======
  const PASSCODE_KEY = 'bitacora_passcode';
  let cloudSyncTimer = null;

  function getPasscode(){
    let pc = localStorage.getItem(PASSCODE_KEY);
    if(!pc){
      pc = prompt('Ingresá tu passcode de la Bitácora para sincronizar entre dispositivos (dejalo en blanco para usar solo en este dispositivo):');
      if(pc) localStorage.setItem(PASSCODE_KEY, pc);
    }
    return pc;
  }

  async function apiFetch(path, options){
    const pc = getPasscode();
    if(!pc) return null; // el usuario eligió no sincronizar
    options = options || {};
    options.headers = Object.assign({}, options.headers, {
      'X-Passcode': pc,
      'Content-Type': 'application/json'
    });
    try{
      const res = await fetch(path, options);
      if(res.status === 401){
        alert('Passcode incorrecto. Se va a pedir de nuevo.');
        localStorage.removeItem(PASSCODE_KEY);
        return null;
      }
      return res;
    }catch(e){
      return null; // sin conexión: no rompe nada, sigue local
    }
  }

  async function syncPull(){
    const res = await apiFetch('/api/notas', { method: 'GET' });
    if(!res || !res.ok) return;
    let data;
    try{ data = await res.json(); }catch(e){ return; }
    if(!data.notas) return;
    let changed = false;
    data.notas.forEach(remote => {
      let remoteNote;
      try{ remoteNote = JSON.parse(remote.contenido); }catch(e){ return; }
      const local = notes.find(n => n.id === remote.id);
      if(!local){
        notes.push(remoteNote);
        changed = true;
      }else if(remote.updated_at > local.updatedAt){
        Object.assign(local, remoteNote);
        changed = true;
      }
    });
    if(changed){
      persist(true); // true: no re-disparar push, ya viene sincronizado
      render();
    }
  }

  function scheduleCloudPush(note){
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(() => syncPushNote(note), 800);
  }

  async function syncPushNote(note){
    if(!note) return;
    await apiFetch('/api/notas', {
      method: 'POST',
      body: JSON.stringify({ id: note.id, contenido: note, updated_at: note.updatedAt })
    });
  }

  async function syncDeleteNote(id){
    if(!id) return;
    await apiFetch('/api/notas/' + encodeURIComponent(id), { method: 'DELETE' });
  }
  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('es-AR', {weekday:'long', day:'2-digit', month:'short', year:'numeric'}) +
      ', ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
  }
  const plainCache = document.createElement('div');
  function plainText(html){
    plainCache.innerHTML = html || '';
    plainCache.querySelectorAll('.comment-note-btn').forEach(b => b.remove());
    return (plainCache.textContent || '').replace(/\s+/g,' ').trim();
  }
  function formatWordCount(n){
    if(n >= 1000){
      const k = n / 1000;
      const rounded = k >= 10 ? Math.round(k) : Math.round(k * 10) / 10;
      return rounded.toLocaleString('es-AR') + 'k';
    }
    return n.toLocaleString('es-AR');
  }

  function render(){
    const q = searchEl.value.trim().toLowerCase();
    const sorted = [...notes].sort((a,b)=>b.updatedAt - a.updatedAt);
    const filtered = q ? sorted.filter(n =>
      (n.title||'').toLowerCase().includes(q) || plainText(n.body).toLowerCase().includes(q)
    ) : sorted;

    if(filtered.length === 0){
      listEl.innerHTML = `<div class="empty">${q ? 'Ningún registro coincide con tu búsqueda.' : 'La bitácora está en blanco.<br>Tocá el sello para comenzar.'}</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(n => {
      const title = n.title.trim() || 'Sin título';
      const bodyText = plainText(n.body);
      const preview = bodyText.slice(0,120) || 'Página en blanco...';
      const wordCount = bodyText ? bodyText.split(/\s+/).filter(Boolean).length : 0;
      // Autocorrección de notas guardadas antes de este arreglo (o
      // abiertas nunca desde entonces): los dos arcoíris no pueden
      // convivir, priorizamos la letra y apagamos el fondo.
      if(n.titleColor === 'rainbow' && n.titleBgColor === 'rainbow'){
        n.titleBgColor = '';
      }
      let titleStyle = '';
      if(n.titleFont){
        titleStyle += `font-family:${n.titleFont};`;
      }
      // OJO: letra arcoíris y fondo arcoíris usan las dos la propiedad
      // "background-image" para el mismo truco de recorte. Si están
      // guardados los dos colores a la vez (uno arcoíris y el otro
      // sólido, de una elección anterior), sólo puede pintarse UNO en
      // pantalla o se pisan entre sí. Le damos prioridad a lo que esté
      // en arcoíris, e ignoramos el color sólido guardado del otro
      // atributo mientras tanto (sigue guardado en los datos, se vuelve
      // a mostrar solo cuando el arcoíris se apague).
      if(n.titleColor === 'rainbow'){
        titleStyle += `background-image:${RAINBOW_GRADIENT};-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:saturate(1.6) brightness(1.25) drop-shadow(0 0 4px rgba(255,255,255,0.5));`;
      }else if(n.titleColor){
        titleStyle += `color:${n.titleColor};`;
      }
      if(n.titleBgColor === 'rainbow'){
        titleStyle += `background-image:linear-gradient(to right, #ff2079 0%, #c026d3 8%, #7b2ff7 17%, #4d3dff 25%, #00e5ff 33%, #00ffc8 42%, #39ff14 50%, #b6ff00 58%, #faed27 67%, #ffb700 75%, #ff9d00 83%, #ff3131 92%, #ff2079 100%);filter:saturate(1.6) brightness(1.15);box-shadow:0 0 10px rgba(255,255,255,0.3);`;
      }else if(n.titleBgColor && n.titleColor !== 'rainbow'){
        titleStyle += `background-image:linear-gradient(to right, ${n.titleBgColor} 55%, transparent);`;
      }
      return `<div class="note-item" data-id="${n.id}">
        <div class="bar"></div>
        <div class="content">
          <div class="note-title"${titleStyle ? ` style="${titleStyle}"` : ''}>${escapeHtml(title)}</div>
          <div class="note-preview">${escapeHtml(preview)}</div>
          <div class="note-date${n.important ? ' important' : ''}">${fmtDate(n.updatedAt)} (${formatWordCount(wordCount)} ${wordCount === 1 ? 'palabra' : 'palabras'})</div>
        </div>
        <button class="item-menu-btn" type="button" data-menu-toggle="${n.id}" aria-label="Opciones">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
        </button>
        <div class="item-menu" data-menu="${n.id}">
          <button class="item-menu-option" type="button" data-action="share" data-id="${n.id}">Compartir</button>
          <button class="item-menu-option danger" type="button" data-action="delete" data-id="${n.id}">Eliminar</button>
        </div>
      </div>`;
    }).join('');
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function openNote(id){
    currentId = id;
    const n = notes.find(x => x.id === id);
    // Autocorrección de notas guardadas antes de este arreglo: los dos
    // arcoíris (letra y fondo) no pueden convivir, así que si quedaron
    // los dos marcados le damos prioridad a la letra y apagamos el fondo.
    if(n.titleColor === 'rainbow' && n.titleBgColor === 'rainbow'){
      n.titleBgColor = '';
    }
    titleEl.textContent = n.title;
    titleEl.style.background = '';
    titleEl.style.backgroundColor = '';
    titleEl.style.webkitBackgroundClip = '';
    titleEl.style.backgroundClip = '';
    titleEl.style.setProperty('-webkit-text-fill-color', '');
    titleEl.style.setProperty('-webkit-text-stroke', '');
    titleEl.style.filter = '';
    titleEl.style.textShadow = '';
    titleEl.style.boxShadow = '';
    titleEl.style.color = '';
    if(n.titleColor === 'rainbow'){
      renderTitleRainbow();
    }else{
      titleEl.style.color = n.titleColor || '';
    }
    if(n.titleBgColor === 'rainbow'){
      titleEl.style.webkitBackgroundClip = 'border-box';
      titleEl.style.backgroundClip = 'border-box';
      titleEl.style.background = RAINBOW_GRADIENT;
      titleEl.style.filter = 'saturate(1.6) brightness(1.15)';
      titleEl.style.boxShadow = '0 0 14px rgba(255,255,255,0.35)';
    }else{
      titleEl.style.backgroundColor = n.titleBgColor || '';
    }
    titleEl.style.fontFamily = n.titleFont || '';
    document.getElementById('fontColorSwatch').style.background = n.titleColor === 'rainbow' ? RAINBOW_GRADIENT : (n.titleColor || '');
    document.getElementById('bgColorSwatch').style.background = n.titleBgColor === 'rainbow' ? RAINBOW_GRADIENT : (n.titleBgColor || '');
    document.getElementById('fontFamilyLabel').textContent = fontFamilyLabelFor(n.titleFont);
    document.getElementById('importantBtn').classList.toggle('active', !!n.important);
    bodyEl.innerHTML = n.body;
    attachNoteButtons();
    typingHighlightArmed = false;
    resetHistory();
    updateFormatState();
    requestAnimationFrame(() => { if(typeof positionThumb === 'function') positionThumb(); });
    viewList.style.display = 'none';
    viewEditor.style.display = 'flex';
    setTimeout(()=>titleEl.textContent ? bodyEl.focus() : titleEl.focus(), 50);
  }

  function newNote(){
    const n = { id: 'n'+Date.now(), title:'', body:'', createdAt: Date.now(), updatedAt: Date.now() };
    notes.push(n);
    persist();
    openNote(n.id);
  }

  // El guardado automático de título/cuerpo es "debounced" (450ms) para no
  // escribir a disco en cada tecla. Eso significa que n.title/n.body del
  // array "notes" pueden estar desactualizados en cualquier momento. Antes
  // de decidir algo que dependa de esos campos (por ejemplo, si la nota
  // está vacía y hay que borrarla al volver atrás), hay que sincronizarlos
  // primero con lo que hay realmente en pantalla, o el debounce pendiente
  // puede perderse: escribís el título, tocás rápido un par de opciones de
  // formato (arcoíris, tipografía...) y volvés atrás antes de que pasen los
  // 450ms: como n.title en memoria seguía vacío, la nota entera se borraba
  // por "nunca tocada", perdiendo también los colores/tipografía elegidos.
  function syncCurrentNoteFields(){
    const n = notes.find(x => x.id === currentId);
    if(!n) return null;
    pruneEmptyMarks();
    n.title = titleEl.textContent;
    n.body = bodyEl.innerHTML;
    return n;
  }

  function closeEditor(){
    clearTimeout(saveTimer);
    // limpiar notas vacías nunca tocadas
    const n = syncCurrentNoteFields();
    if(n && !n.title.trim() && !plainText(n.body)){
      notes = notes.filter(x => x.id !== currentId);
    }
    persist();
    currentId = null;
    bodyEl.innerHTML = '';
    bodyEl.style.paddingBottom = '';
    document.getElementById('formatBar').classList.remove('floating');
    viewEditor.style.display = 'none';
    viewList.style.display = 'flex';
    render();
  }

  function saveNow(){
    clearTimeout(saveTimer);
    const n = syncCurrentNoteFields();
    if(!n) return;
    n.updatedAt = Date.now();
    persist();
    flashSaved();
  }

  function scheduleSave(){
    pushHistoryDebounced();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      const n = syncCurrentNoteFields();
      if(!n) return;
      n.updatedAt = Date.now();
      persist();
      flashSaved();
    }, 450);
  }

  function flashSaved(msg){
    saveFlag.textContent = msg || 'consignado';
    saveFlag.classList.add('show');
    clearTimeout(flagTimer);
    flagTimer = setTimeout(()=> saveFlag.classList.remove('show'), 1200);
  }

  // Modo "sigo escribiendo resaltado": arma/desarma el resaltado para lo
  // próximo que el usuario tipee. No interceptamos el tipeo letra por letra
  // (eso rompía el orden con el teclado predictivo/autocorrección de
  // Android); en cambio solo movemos el cursor adentro o afuera de una
  // marca vacía, y dejamos que el navegador tipee de forma 100% nativa.
  let typingHighlightArmed = false;

  function closestMark(node){
    while(node && node !== bodyEl){
      if(node.nodeType === 1 && node.classList && node.classList.contains('comment-mark')) return node;
      node = node.parentNode;
    }
    return null;
  }

  // Botoncito "Nota" dentro de cada resaltado: es contenteditable="false"
  // (una isla atómica dentro del editor, como una mención), así que el
  // teclado/backspace/flechas lo tratan como una sola unidad y no rompe
  // la edición del texto resaltado que lo rodea.
  function ensureNoteButton(mark){
    let btn = mark.querySelector(':scope > .comment-note-btn');
    if(!btn){
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'comment-note-btn';
      btn.setAttribute('contenteditable', 'false');
      btn.textContent = 'Nota';
      mark.appendChild(btn);
    }
    mark.classList.toggle('has-note', !!(mark.dataset.note && mark.dataset.note.trim()));
    return btn;
  }

  function attachNoteButtons(){
    bodyEl.querySelectorAll('.comment-mark').forEach(ensureNoteButton);
  }

  let activeNoteMark = null;
  const noteModal = document.getElementById('noteModal');
  const noteTextarea = document.getElementById('noteTextarea');

  function openNotePanel(mark){
    if(!mark) return;
    activeNoteMark = mark;
    noteTextarea.value = mark.dataset.note || '';
    document.getElementById('noteDelete').style.display = mark.dataset.note ? '' : 'none';
    noteModal.classList.add('show');
    setTimeout(() => noteTextarea.focus(), 50);
  }

  function closeNotePanel(){
    noteModal.classList.remove('show');
    activeNoteMark = null;
  }

  function saveNotePanel(){
    if(!activeNoteMark) return;
    const text = noteTextarea.value.trim();
    if(text){
      activeNoteMark.dataset.note = text;
    }else{
      delete activeNoteMark.dataset.note;
    }
    activeNoteMark.classList.toggle('has-note', !!text);
    closeNotePanel();
    scheduleSave();
  }

  function deleteNotePanel(){
    if(!activeNoteMark) return;
    delete activeNoteMark.dataset.note;
    activeNoteMark.classList.remove('has-note');
    closeNotePanel();
    scheduleSave();
  }

  function currentCaretNode(){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return null;
    return sel.getRangeAt(0).startContainer;
  }

  function isCommentActive(){
    return typingHighlightArmed || !!closestMark(currentCaretNode());
  }

  function updateFormatState(){
    document.querySelectorAll('[data-cmd]').forEach(btn => {
      try{
        btn.classList.toggle('active', document.queryCommandState(btn.dataset.cmd));
      }catch(e){}
    });
    const commentBtn = document.getElementById('commentBtn');
    if(commentBtn){
      const on = isCommentActive();
      commentBtn.classList.toggle('active', on);
      commentBtn.textContent = on ? 'Guardar' : 'Comentar...';
    }
  }

  function unwrapMark(markEl){
    const noteBtn = markEl.querySelector(':scope > .comment-note-btn');
    if(noteBtn) noteBtn.remove();
    const parent = markEl.parentNode;
    const nextSibling = markEl.nextSibling;
    const movedNodes = [];
    while(markEl.firstChild){
      const child = markEl.firstChild;
      parent.insertBefore(child, markEl);
      movedNodes.push(child);
    }
    parent.removeChild(markEl);

    // Dejamos el cursor colapsado (sin nada seleccionado) justo después de
    // lo que acabamos de des-resaltar. Si queda una selección real activa,
    // Android la pinta con su propio color nativo, que mezclado con el
    // fondo oscuro de la app se ve como un parche amarillento.
    const sel = window.getSelection();
    const r2 = document.createRange();
    if(movedNodes.length){
      const last = movedNodes[movedNodes.length - 1];
      if(last.nodeType === 3){
        r2.setStart(last, last.length);
      }else{
        r2.selectNodeContents(last);
        r2.collapse(false);
      }
    }else if(nextSibling){
      r2.setStartBefore(nextSibling);
    }else{
      r2.selectNodeContents(parent);
      r2.collapse(false);
    }
    r2.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r2);
  }

  function wrapSelectionInMark(range){
    const mark = document.createElement('span');
    mark.className = 'comment-mark';
    mark.appendChild(range.extractContents());
    range.insertNode(mark);
    ensureNoteButton(mark);
    // Cursor colapsado al final de la marca, no la dejamos "seleccionada"
    // (mismo motivo que en unwrapMark).
    const sel = window.getSelection();
    const r2 = document.createRange();
    r2.selectNodeContents(mark);
    r2.collapse(false);
    sel.removeAllRanges();
    sel.addRange(r2);
  }

  const RAINBOW_GRADIENT = 'linear-gradient(90deg,#ff2079,#c026d3,#7b2ff7,#4d3dff,#00e5ff,#00ffc8,#39ff14,#b6ff00,#faed27,#ffb700,#ff9d00,#ff3131,#ff2079)';

  // ---- Arcoíris de LETRA del título, pintado con spans reales ----
  // Antes esto se hacía con el truco de "background-clip:text" +
  // texto transparente sobre todo el elemento. Ese combo (sumado al
  // overflow-x:auto para poder desplazar títulos largos) hacía que
  // algunos WebViews de Android dejaran de tratar el título como
  // scrolleable con el dedo. La solución de fondo (arcoíris de fondo,
  // que usa "background-clip:border-box") nunca tuvo ese problema
  // porque no toca el color de la letra. Acá pintamos cada letra con
  // su propio span de color SÓLIDO -sin recortes ni transparencias-,
  // igual que ya se hace con el arcoíris del cuerpo, y así el scroll
  // del título queda exactamente igual que con cualquier otro color.
  const RAINBOW_STOPS = ['#ff2079','#c026d3','#7b2ff7','#4d3dff','#00e5ff','#00ffc8','#39ff14','#b6ff00','#faed27','#ffb700','#ff9d00','#ff3131','#ff2079'];

  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
  }
  function rainbowColorAt(t){
    const segCount = RAINBOW_STOPS.length - 1;
    const pos = Math.min(1, Math.max(0, t)) * segCount;
    let idx = Math.floor(pos);
    if(idx >= segCount) idx = segCount - 1;
    const localT = pos - idx;
    const c1 = hexToRgb(RAINBOW_STOPS[idx]);
    const c2 = hexToRgb(RAINBOW_STOPS[idx + 1]);
    return rgbToHex(
      c1[0] + (c2[0] - c1[0]) * localT,
      c1[1] + (c2[1] - c1[1]) * localT,
      c1[2] + (c2[2] - c1[2]) * localT
    );
  }
  function escapeHtmlChar(ch){
    if(ch === '&') return '&amp;';
    if(ch === '<') return '&lt;';
    if(ch === '>') return '&gt;';
    return ch;
  }
  function buildTitleRainbowHTML(text){
    const chars = [...text];
    const n = chars.length;
    if(n === 0) return '';
    return chars.map((ch, i) => {
      const t = n === 1 ? 0 : i / (n - 1);
      return `<span style="color:${rainbowColorAt(t)}">${escapeHtmlChar(ch)}</span>`;
    }).join('');
  }
  // Cuenta cuántos caracteres hay antes del cursor, para poder
  // reubicarlo en el mismo lugar después de reconstruir los spans.
  function getCaretCharOffset(el){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return null;
    const range = sel.getRangeAt(0);
    if(!el.contains(range.startContainer)) return null;
    const pre = document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.startContainer, range.startOffset);
    return pre.toString().length;
  }
  function setCaretCharOffset(el, offset){
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    let node, count = 0, targetNode = null, targetOffset = 0;
    while((node = walker.nextNode())){
      const next = count + node.textContent.length;
      if(offset <= next){
        targetNode = node;
        targetOffset = offset - count;
        break;
      }
      count = next;
      targetNode = node;
      targetOffset = node.textContent.length;
    }
    if(!targetNode) return;
    const range = document.createRange();
    range.setStart(targetNode, targetOffset);
    range.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  function renderTitleRainbow(){
    const text = titleEl.textContent;
    const focused = document.activeElement === titleEl;
    const offset = focused ? getCaretCharOffset(titleEl) : null;
    titleEl.innerHTML = buildTitleRainbowHTML(text);
    if(focused && offset !== null) setCaretCharOffset(titleEl, offset);
  }
  // Saca los spans de color por letra y deja el título como un solo
  // nodo de texto plano (para cuando se pasa a un color sólido).
  function flattenTitleToPlainText(){
    const focused = document.activeElement === titleEl;
    const offset = focused ? getCaretCharOffset(titleEl) : null;
    titleEl.textContent = titleEl.textContent;
    if(focused && offset !== null) setCaretCharOffset(titleEl, offset);
  }

  function pruneEmptyMarks(){
    // Saca marcas de resaltado que quedaron vacías (armadas pero nunca
    // usadas para escribir nada), salvo la que tiene el cursor adentro
    // en este momento.
    const sel = window.getSelection();
    const liveNode = sel && sel.rangeCount ? sel.getRangeAt(0).startContainer : null;
    bodyEl.querySelectorAll('.comment-mark').forEach(mark => {
      const noteBtn = mark.querySelector(':scope > .comment-note-btn');
      const stripped = (noteBtn ? mark.textContent.slice(0, -noteBtn.textContent.length) : mark.textContent)
        .replace(/\u200B/g, '');
      if(stripped === '' && !mark.contains(liveNode)){
        mark.parentNode.removeChild(mark);
      }
    });
    attachNoteButtons();
  }

  function armTypingHighlight(range){
    const mark = document.createElement('span');
    mark.className = 'comment-mark';
    const textNode = document.createTextNode('\u200B');
    mark.appendChild(textNode);
    range.insertNode(mark);
    const sel = window.getSelection();
    const r2 = document.createRange();
    r2.setStart(textNode, 1);
    r2.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r2);
    typingHighlightArmed = true;
  }

  function exitMarkAtCaret(mark){
    // Coloca el cursor justo después de la marca, afuera de ella, para que
    // lo próximo que se tipee salga sin resaltado.
    const marker = document.createTextNode('\u200B');
    if(mark.nextSibling){
      mark.parentNode.insertBefore(marker, mark.nextSibling);
    }else{
      mark.parentNode.appendChild(marker);
    }
    const sel = window.getSelection();
    const r2 = document.createRange();
    r2.setStart(marker, 1);
    r2.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r2);
    pruneEmptyMarks();
  }

  function toggleComment(){
    bodyEl.focus();
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);

    if(!range.collapsed){
      // Hay texto seleccionado: resaltamos u des-resaltamos justo esa selección.
      const startMark = closestMark(range.startContainer);
      const endMark = closestMark(range.endContainer);
      if(startMark && startMark === endMark){
        unwrapMark(startMark);
      }else{
        wrapSelectionInMark(range);
      }
      typingHighlightArmed = false;
    }else{
      // Sin selección: prendemos o apagamos el modo "sigo escribiendo resaltado".
      const mark = closestMark(range.startContainer);
      if(mark){
        typingHighlightArmed = false;
        exitMarkAtCaret(mark);
      }else{
        armTypingHighlight(range);
      }
    }
    updateFormatState();
    scheduleSave();
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error('formato inválido');
        const existingIds = new Set(notes.map(n=>n.id));
        data.forEach(n => {
          if(n && n.id && !existingIds.has(n.id)){
            notes.push({
              id:n.id, title:n.title||'', body:n.body||'',
              createdAt:n.createdAt||Date.now(), updatedAt:n.updatedAt||Date.now()
            });
          }
        });
        persist();
        render();
      }catch(e){
        alert('No se pudo leer esa copia. Verificá el archivo.');
      }
    };
    reader.readAsText(file);
  }

  function copyForWord(){
    const titleText = titleEl.textContent.trim();
    const bodyClone = bodyEl.cloneNode(true);
    bodyClone.querySelectorAll('.comment-note-btn').forEach(b => b.remove());
    const inlined = bodyClone.innerHTML.replace(
      /<span class="comment-mark"[^>]*>/g,
      '<span style="background:#a9c9d6;color:#1c3540;border-radius:2px;padding:0.03em 0.15em;">'
    );
    const bodyHtml = `<p>${inlined.replace(/<br\s*\/?>/gi, '</p><p>')}</p>`;
    const html = (titleText ? `<h2>${escapeHtml(titleText)}</h2>` : '') + bodyHtml;

    const clone = document.createElement('div');
    clone.innerHTML = bodyClone.innerHTML.replace(/<br\s*\/?>/gi, '\n');
    const text = (titleText ? titleText + '\n\n' : '') + (clone.textContent || '');

    const finish = () => flashSaved('copiado');
    const fail = () => {
      // Recordamos qué estaba enfocado (título o cuerpo) antes de este
      // método de respaldo, porque el truco del textarea oculto SÍ mueve
      // el foco a propósito (hace falta para poder seleccionarlo y
      // copiarlo) y eso bajaría la barra flotante de golpe. Al terminar,
      // devolvemos el foco a donde estaba para que la barra no se mueva.
      const previouslyFocused = document.activeElement;
      const shouldRestoreFocus = previouslyFocused === bodyEl || previouslyFocused === titleEl;
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        if(shouldRestoreFocus) previouslyFocused.focus();
        finish();
      }catch(e){
        if(shouldRestoreFocus) previouslyFocused.focus();
        alert('No se pudo copiar automáticamente. Seleccioná el texto a mano.');
      }
    };

    if(navigator.clipboard && window.ClipboardItem){
      try{
        const item = new ClipboardItem({
          'text/html': new Blob([html], {type:'text/html'}),
          'text/plain': new Blob([text], {type:'text/plain'})
        });
        navigator.clipboard.write([item]).then(finish).catch(fail);
      }catch(e){ fail(); }
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(finish).catch(fail);
    } else {
      fail();
    }
  }

  // ---- Pinch-to-zoom (solo dentro del área de escritura) ----
  (function setupPinchZoom(){
    const MIN_SIZE = 0.75, MAX_SIZE = 2.6; // rem
    const ZOOM_KEY = 'bitacora_apocrifa_bodyzoom';
    let pinchActive = false;
    let startDist = 0;
    let startSize = 1;

    function currentSize(){
      const stored = parseFloat(localStorage.getItem(ZOOM_KEY));
      if(!isNaN(stored)) return stored;
      const cs = parseFloat(getComputedStyle(bodyEl).fontSize);
      return cs / 16; // px -> rem aprox
    }
    function applySize(remValue){
      bodyEl.style.fontSize = remValue + 'rem';
      localStorage.setItem(ZOOM_KEY, remValue.toFixed(3));
    }
    // Aplicar tamaño guardado al cargar
    applySize(currentSize());

    function dist(touches){
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    bodyEl.addEventListener('touchstart', e => {
      if(e.touches.length === 2){
        pinchActive = true;
        startDist = dist(e.touches);
        startSize = currentSize();
      }
    }, {passive:true});

    bodyEl.addEventListener('touchmove', e => {
      if(pinchActive && e.touches.length === 2){
        e.preventDefault();
        const newDist = dist(e.touches);
        if(startDist > 0){
          const ratio = newDist / startDist;
          let newSize = startSize * ratio;
          newSize = Math.min(MAX_SIZE, Math.max(MIN_SIZE, newSize));
          applySize(newSize);
        }
      }
    }, {passive:false});

    function endPinch(e){
      if(e.touches.length < 2) pinchActive = false;
    }
    bodyEl.addEventListener('touchend', endPinch);
    bodyEl.addEventListener('touchcancel', endPinch);

    // Salvaguarda extra: si el navegador fuerza el zoom nativo por accesibilidad,
    // bloqueamos cualquier gesto de 2 dedos fuera del cuadro de texto.
    document.addEventListener('touchmove', e => {
      if(e.touches.length > 1 && !bodyEl.contains(e.target)){
        e.preventDefault();
      }
    }, {passive:false});
  })();

  // ---------- barra flotante arriba del teclado ----------
  // El meta "interactive-widget=resizes-content" solo lo respeta Chrome/Android.
  // En iOS Safari (y otros) el teclado no reacomoda el layout viewport, así que
  // un position:fixed;bottom:0 a secas queda mal ubicado (tapado por el teclado
  // o saltando arriba de todo). Usamos la VisualViewport API para calcular a
  // mano cuánto espacio ocupa el teclado y empujar la barra justo por encima.
  const formatBarEl = document.getElementById('formatBar');
  let hideFloatTimeout = null;
  const vv = window.visualViewport;
  // Margen de solape: mejor pisar de más el teclado que dejar un hueco.
  // Los eventos "resize"/"scroll" del visualViewport llegan con la posición
  // YA actualizada, pero durante la animación de apertura/cierre del
  // teclado pueden llegar más lento que el movimiento visual real (sobre
  // todo en WebViews embebidos, no Chrome completo) -y en algunos de esos
  // WebViews (como el navegador interno de algunos gestores de archivos)
  // la altura que reporta visualViewport queda corta de forma persistente
  // incluso con el teclado ya asentado, no solo durante la animación. Por
  // eso el margen es generoso: es preferible que la barra tape un pelín
  // el borde de arriba del teclado a que se vea un hilito de la nota por
  // el medio.
  const KEYBOARD_OVERLAP_PX = 22;
  // Por debajo de este umbral no consideramos que "hay teclado": al
  // enfocar un campo (incluso por el autoenfoque al abrir la nota) pasa
  // un instante antes de que el teclado real empiece a taparlo. Si
  // activábamos "floating" apenas se enfocaba, la barra saltaba de golpe
  // a la posición flotante (bottom:0, pegada al borde de abajo) un
  // instante antes de que hiciera falta, e incluso quedaba así sin razón
  // en contextos sin teclado (por ejemplo el autoenfoque al abrir la
  // nota, o al probar el archivo en una compu sin teclado táctil).
  const KEYBOARD_SHOW_THRESHOLD_PX = 24;
  let keyboardTrackRaf = null;
  let keyboardTrackUntil = 0;
  // Altura de referencia "sin teclado". La necesitamos porque hay DOS
  // comportamientos distintos según el navegador/WebView:
  //  (A) el más común: al abrir el teclado, window.innerHeight NO cambia
  //      (el layout viewport se queda como si nada), y es SOLO el
  //      visualViewport el que se achica. Ahí "keyboardCoveragePx()" ya
  //      detecta bien la diferencia.
  //  (B) algunos navegadores/WebViews SÍ respetan el meta
  //      "interactive-widget=resizes-content" y achican directamente
  //      window.innerHeight junto con el teclado. En ese caso el
  //      visualViewport queda IGUAL que el layout viewport (la resta da
  //      0 todo el tiempo) y "keyboardCoveragePx()" nunca detecta nada,
  //      aunque la barra en realidad no necesita ningún corrimiento extra
  //      (bottom:0 ya queda pegada arriba del teclado solo).
  // Para no depender de adivinar cuál de los dos es este dispositivo,
  // guardamos la altura "de referencia" apenas se enfoca un campo (antes
  // de que el teclado tenga chance de aparecer) y comparamos contra eso
  // para decidir si ACTIVAR el modo flotante, sin importar cuál de los
  // dos casos sea.
  let heightBeforeKeyboard = window.innerHeight;

  function keyboardCoveragePx(){
    if(!vv) return 0;
    return Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
  }

  // Cuánto se "comió" el teclado del layout viewport en sí (caso B de
  // arriba). Si esto es mayor a 0, el navegador ya reacomodó todo solo.
  function layoutShrinkPx(){
    return Math.max(0, heightBeforeKeyboard - window.innerHeight);
  }

  function keyboardLikelyOpen(){
    return keyboardCoveragePx() >= KEYBOARD_SHOW_THRESHOLD_PX || layoutShrinkPx() >= KEYBOARD_SHOW_THRESHOLD_PX;
  }

  function positionFloatingBar(){
    if(!formatBarEl.classList.contains('floating')) return;
    if(vv){
      // Espacio "tapado" entre el borde inferior del viewport visual y el
      // del viewport de layout: eso es, a grandes rasgos, el teclado.
      const covered = keyboardCoveragePx();
      const bottomPx = covered > 0 ? Math.ceil(covered) - KEYBOARD_OVERLAP_PX : 0;
      formatBarEl.style.bottom = Math.max(0, bottomPx) + 'px';
    }else{
      formatBarEl.style.bottom = '0px';
    }
  }

  // Persigue al teclado cuadro a cuadro (en vez de solo en los eventos
  // puntuales) durante la ventana de tiempo en que se está animando,
  // para que la barra quede "pegada" en todo momento y no salte al final.
  // También es quien decide, recién cuando el teclado ya está realmente
  // tapando algo, activar el modo flotante.
  function trackKeyboardMotion(durationMs){
    keyboardTrackUntil = Math.max(keyboardTrackUntil, performance.now() + durationMs);
    if(keyboardTrackRaf) return;
    const step = () => {
      activateFloatingIfKeyboardVisible();
      positionFloatingBar();
      updateBodyPadding();
      if(performance.now() < keyboardTrackUntil){
        keyboardTrackRaf = requestAnimationFrame(step);
      }else{
        keyboardTrackRaf = null;
      }
    };
    keyboardTrackRaf = requestAnimationFrame(step);
  }
